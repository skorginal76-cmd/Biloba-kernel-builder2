name: Port and Build Biloba Kernel (Android 12 5.10)

on:
  workflow_dispatch:
    inputs:
      biloba_repo:
        description: 'Biloba R-OSS Repo URL'
        required: true
        default: 'https://github.com/MiCode/Xiaomi_Kernel_OpenSource'
      biloba_branch:
        description: 'Biloba R-OSS Branch'
        required: true
        default: 'biloba-r-oss'
      target_repo:
        description: 'Target Kernel Repo URL'
        required: true
        default: 'https://github.com/MillenniumOSS/android_kernel_common_android12-5.10'
      target_branch:
        description: 'Target Kernel Branch'
        required: true
        default: 'millennium-base'
      defconfig_name:
        description: 'Defconfig File Name'
        required: true
        default: 'biloba_defconfig'

jobs:
  port_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 10240
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libncurses5-dev \
            git rsync wget tar unzip zip device-tree-compiler \
            libelf-dev ccache lz4 liblz4-tool python3 python-is-python3

      - name: Clone Proton Clang Toolchain
        run: |
          echo "==> Cloning Proton Clang toolchain..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain/clang

      - name: Clone Biloba R-OSS Kernel Source
        run: |
          echo "==> Cloning Biloba Source (${{ github.event.inputs.biloba_branch }})..."
          git clone --depth=1 -b ${{ github.event.inputs.biloba_branch }} ${{ github.event.inputs.biloba_repo }} biloba-source

      - name: Clone Target Android 12 (5.10) Common Kernel
        run: |
          echo "==> Cloning Target Kernel (${{ github.event.inputs.target_branch }})..."
          git clone --depth=1 -b ${{ github.event.inputs.target_branch }} ${{ github.event.inputs.target_repo }} target-kernel

      - name: Port Biloba Files into Target Kernel
        run: |
          SRC="$GITHUB_WORKSPACE/biloba-source"
          TGT="$GITHUB_WORKSPACE/target-kernel"

          echo "==> Starting Porting Process..."

          # 1. Defconfig & Vendor Configs
          echo "[1/5] Copying Defconfigs..."
          mkdir -p "$TGT/arch/arm64/configs"
          find "$SRC/arch/arm64/configs/" -iname "*biloba*" -exec cp -v {} "$TGT/arch/arm64/configs/" \; 2>/dev/null || true
          find "$SRC/arch/arm/configs/" -iname "*biloba*" -exec cp -v {} "$TGT/arch/arm/configs/" \; 2>/dev/null || true

          # 2. Device Tree (DTS / DTSI)
          echo "[2/5] Copying Device Trees..."
          mkdir -p "$TGT/arch/arm64/boot/dts/mediatek"
          find "$SRC/arch/arm64/boot/dts/" -iname "*biloba*" -exec cp -r -v {} "$TGT/arch/arm64/boot/dts/" \; 2>/dev/null || true

          # 3. MediaTek & Vendor Drivers
          echo "[3/5] Porting MediaTek & Touchscreen drivers..."
          if [ -d "$SRC/drivers/misc/mediatek" ]; then
            mkdir -p "$TGT/drivers/misc/mediatek"
            rsync -av --update "$SRC/drivers/misc/mediatek/" "$TGT/drivers/misc/mediatek/"
          fi

          if [ -d "$SRC/drivers/input/touchscreen" ]; then
            rsync -av --update "$SRC/drivers/input/touchscreen/" "$TGT/drivers/input/touchscreen/"
          fi

          # 4. Techpack & Subsystems
          echo "[4/5] Porting Techpack & Vendor Modules..."
          if [ -d "$SRC/techpack" ]; then
            rsync -av --update "$SRC/techpack/" "$TGT/techpack/"
          fi
          if [ -d "$SRC/drivers/vendor" ]; then
            rsync -av --update "$SRC/drivers/vendor/" "$TGT/drivers/vendor/"
          fi

          # 5. DT-Bindings & Headers
          echo "[5/5] Merging Header Dependencies..."
          if [ -d "$SRC/include/dt-bindings" ]; then
            rsync -av --update "$SRC/include/dt-bindings/" "$TGT/include/dt-bindings/"
          fi

          echo "==> Porting completed successfully."

      - name: Build Kernel
        run: |
          cd target-kernel
          
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "==> Searching for biloba defconfig inside arch/arm64/configs..."
          
          # Defconfig dosyasını tara ve bulursan root configs dizinine hizala
          FOUND_DEF_PATH=$(find arch/arm64/configs/ -iname "*biloba*" -type f | head -n 1)
          
          if [ -n "$FOUND_DEF_PATH" ]; then
            DEFCONFIG_NAME=$(basename "$FOUND_DEF_PATH")
            echo "Found defconfig: $FOUND_DEF_PATH"
            cp -f "$FOUND_DEF_PATH" arch/arm64/configs/
          else
            echo "Target defconfig not found by search, fallback to input parameter..."
            DEFCONFIG_NAME="${{ github.event.inputs.defconfig_name }}"
          fi

          echo "==> Generating .config with ARCH=arm64 ($DEFCONFIG_NAME)..."
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- $DEFCONFIG_NAME 2>&1 | tee build.log

          # .config dosyası oluşmadıysa varsayılan defconfig ile fallback yap
          if [ ! -f "out/.config" ]; then
            echo "WARNING: $DEFCONFIG_NAME failed to produce out/.config! Fallback to standard defconfig..."
            make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- defconfig 2>&1 | tee -a build.log
          fi

          echo "==> Starting Kernel Compilation..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee -a build.log

      - name: Package Kernel Output (Image & DTB)
        run: |
          cd target-kernel
          mkdir -p $GITHUB_WORKSPACE/build_output

          cp build.log $GITHUB_WORKSPACE/build_output/ 2>/dev/null || true

          OUT_DIR="out/arch/arm64/boot"
          
          if [ -d "$OUT_DIR" ]; then
            echo "==> Collecting compiled images and DTBs from $OUT_DIR..."
            find $OUT_DIR -maxdepth 2 \( -name "Image*" -o -name "*.dtb" -o -name "*.dtbo" -o -name "dtb" \) -exec cp -v {} $GITHUB_WORKSPACE/build_output/ \;
          else
            echo "==> Searching whole build directory for Image/DTB files..."
            find out/ -type f \( -name "Image*" -o -name "*.dtb" -o -name "*.dtbo" \) -exec cp -v {} $GITHUB_WORKSPACE/build_output/ \; || true
          fi

          cd $GITHUB_WORKSPACE/build_output
          echo "==> Creating Output Zip Archive..."
          zip -r $GITHUB_WORKSPACE/biloba-kernel-artifacts.zip .

      - name: Upload Build Log Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: target-kernel/build.log

      - name: Upload Kernel Image & DTB Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biloba-kernel-artifacts
          path: biloba-kernel-artifacts.zip
