name: Godmode Biloba Kernel Build

on:
  workflow_dispatch:

env:
  XIAOMI_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  XIAOMI_BRANCH: biloba-r-oss
  KERNEL_DIR: ${{ github.workspace }}/kernel-source
  CLANG_DIR: ${{ github.workspace }}/aosp-clang

jobs:
  build-godmode:
    name: Bulletproof Native Build Stack
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v6

      - name: Native 64-Bit Çapraz Derleyicileri ve Bağımlılıkları Kur
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev lz4 lzip ninja-build \
            python3 python-is-python3 tar u-boot-tools xz-utils \
            zip zlib1g-dev libncurses5-dev libncurses5 libtinfo5 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            wget

      - name: Git Güvenlik Ayarını Yap
        run: |
          git config --global --add safe.directory '*'

      - name: Resmi Xiaomi Kernel Kaynağını Çek (MiCode)
        run: |
          git clone --depth=1 $XIAOMI_REPO -b $XIAOMI_BRANCH $KERNEL_DIR

      - name: OEM Eksik Firmware Yaması (Kapsamlı Dummy Injection)
        run: |
          cd $KERNEL_DIR
          echo "::group::Dokunmatik Panel (Focaltech) Firmware Yamaları"
          
          mkdir -p drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware
          
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_huaxing_v0c.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_tianma_v0c.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_huaxing_v0d.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_tianma_v0d.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_sample.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_sample1.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_sample2.i
          
          echo "::endgroup::"

      - name: ZRAM Gelişmiş Kapasite ve Kullanım Yaması (8GB Disk / 6GB Limit)
        run: |
          cd $KERNEL_DIR
          echo "::group::ZRAM Çekirdek Seviyesi Sürücü Enjeksiyonu"
          
          python3 -c '
          import os
          filepath = "drivers/block/zram/zram_drv.c"
          if os.path.exists(filepath):
              with open(filepath, "r") as f:
                  code = f.read()
              
              if "static ssize_t disksize_store" in code:
                  pos = code.find("static ssize_t disksize_store")
                  brace = code.find("{", pos)
                  if brace != -1:
                      code = code[:brace+1] + "\n\tbuf = \"8G\";\n" + code[brace+1:]
              
              if "static ssize_t mem_limit_store" in code:
                  pos = code.find("static ssize_t mem_limit_store")
                  brace = code.find("{", pos)
                  if brace != -1:
                      code = code[:brace+1] + "\n\tbuf = \"6G\";\n" + code[brace+1:]
              
              if "zram->disksize = disksize;" in code:
                  code = code.replace("zram->disksize = disksize;", "zram->disksize = disksize;\n\tzram->limit_pages = 6ULL * 1024 * 1024 * 1024 >> PAGE_SHIFT;")
              
              with open(filepath, "w") as f:
                  f.write(code)
              print("SUCCESS: ZRAM kilitlendi.")
          '
          echo "::endgroup::"

      - name: Kingston Fury 32GB Sanal Bellek Cihaz Sınıfı Enjeksiyonu (Advanced Binary Mode)
        run: |
          cd $KERNEL_DIR
          echo "::group::Native Virtual Memory Device Donanım Yapısı Enjekte Ediliyor"
          
          # Resmi Aygıt Sınıfı ve İkili (Binary) Veri Bloklu Sürücü Tasarımı
          cat << 'EOF' > drivers/base/kingston_fury.c
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/init.h>
          #include <linux/device.h>
          #include <linux/sysfs.h>
          #include <linux/string.h>

          static struct class *kf_class;
          static struct device *kf_device;

          // Kingston Fury Donanım Kimliği ve XMP Karakteristiklerini Simüle Eden 64-Baytlık Saf İkili (Binary) Kod Bloğu
          static const unsigned char kf_hardware_binary[] = {
              0x23, 0x4B, 0x49, 0x4E, 0x47, 0x53, 0x54, 0x4F, // "KINGSTON" ASCII başlığı
              0x4E, 0x20, 0x46, 0x55, 0x52, 0x59, 0x20, 0x33, // "N FURY 3"
              0x32, 0x47, 0x42, 0x00, 0x01, 0x02, 0x03, 0x04, // "2GB" Kapasite İmzası
              0x0B, 0x40, 0x0E, 0x0C, 0x12, 0x01, 0x00, 0x00, // Çekirdek JEDEC Donanım Zamanlamaları
              0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 
              0x85, 0x9B, 0xFF, 0x00, 0x02, 0x00, 0x00, 0x00, // XMP Donanım Voltaj Profili (1.35V Simülasyonu)
              0x46, 0x55, 0x52, 0x59, 0x58, 0x4D, 0x50, 0x31, // "FURYXMP1" Binary Profil Mührü
              0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x03  // Revizyon Kapanış Kodu
          };

          // Metinsel Özellik Gösterimleri
          static ssize_t vendor_show(struct device *dev, struct device_attribute *attr, char *buf) {
              return sprintf(buf, "Kingston\n");
          }
          static ssize_t model_show(struct device *dev, struct device_attribute *attr, char *buf) {
              return sprintf(buf, "Fury Renegade Virtual High-Speed\n");
          }
          static ssize_t capacity_bytes_show(struct device *dev, struct device_attribute *attr, char *buf) {
              return sprintf(buf, "34359738368\n"); // Tam 32 GB
          }
          static ssize_t clock_speed_mhz_show(struct device *dev, struct device_attribute *attr, char *buf) {
              return sprintf(buf, "4600 MHz\n"); // Sanal Frekans Sınırı
          }
          static ssize_t type_show(struct device *dev, struct device_attribute *attr, char *buf) {
              return sprintf(buf, "Virtual Memory Device (Zero-Footprint Topology Mode)\n");
          }

          static DEVICE_ATTR_RO(vendor);
          static DEVICE_ATTR_RO(model);
          static DEVICE_ATTR_RO(capacity_bytes);
          static DEVICE_ATTR_RO(clock_speed_mhz);
          static DEVICE_ATTR_RO(type);

          // Sistem araçlarının ham donanım imzası okuması için oluşturulan Binary Aygıt Düğümü
          static ssize_t kf_binary_read(struct file *filp, struct kobject *kobj,
                                        struct bin_attribute *bin_attr,
                                        char *buf, loff_t off, size_t count) {
              return memory_read_from_buffer(buf, count, &off, kf_hardware_binary, sizeof(kf_hardware_binary));
          }

          static struct bin_attribute kf_bin_attr = {
              .attr = { .name = "raw_hardware_specs", .mode = 0444 },
              .size = sizeof(kf_hardware_binary),
              .read = kf_binary_read,
          };

          static int __init kingston_fury_device_init(void) {
              int ret;

              // 1. Çekirdeğe "virtual_memory" adında resmi bir aygıt sınıfı kaydediyoruz
              kf_class = class_create(THIS_MODULE, "virtual_memory");
              if (IS_ERR(kf_class)) return PTR_ERR(kf_class);

              // 2. Bu sınıfın altına "kingston_fury0" isimli resmi sanal bellek cihazını bağlıyoruz
              kf_device = device_create(kf_class, NULL, MKDEV(0, 0), NULL, "kingston_fury0");
              if (IS_ERR(kf_device)) {
                  class_destroy(kf_class);
                  return PTR_ERR(kf_device);
              }

              // 3. Standart sysfs donanım niteliklerini aygıta mühürlüyoruz
              ret = device_create_file(kf_device, &dev_attr_vendor);
              ret = device_create_file(kf_device, &dev_attr_model);
              ret = device_create_file(kf_device, &dev_attr_capacity_bytes);
              ret = device_create_file(kf_device, &dev_attr_clock_speed_mhz);
              ret = device_create_file(kf_device, &dev_attr_type);

              // 4. İkili (Binary) donanım imzasını aygıta enjekte ediyoruz
              ret = device_create_bin_file(kf_device, &kf_bin_attr);

              return 0;
          }

          device_initcall(kingston_fury_device_init);
          MODULE_LICENSE("GPL");
          EOF
          
          # Sürücüyü derleme ağacına dahil et
          echo "obj-y += kingston_fury.o" >> drivers/base/Makefile
          echo "SUCCESS: Kingston Fury resmi Virtual Memory Device yapısı binary desteğiyle entegre edildi."
          echo "::endgroup::"

      - name: Resmi Google AOSP Clang İndir (Sadece Frontend)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android11-release $CLANG_DIR

      - name: Godmode Derleme Başlat (Doğrudan Argümanlı)
        run: |
          cd $KERNEL_DIR
          
          export PATH="$CLANG_DIR/clang-r383902b/bin:$PATH"
          
          mkdir -p out
          
          make O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" biloba_defconfig
          
          make -j$(nproc --all) O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error"

      - name: Derleme Doğrulama Kontrolü (Sanity Check)
        run: |
          if [ ! -f $KERNEL_DIR/out/arch/arm64/boot/Image ]; then
            echo "::error::Kritik Hata: Godmode üretimi Image çıktısı üretemedi."
            exit 1
          fi

      - name: Orijinal Image Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: godmode-biloba-Image
          path: kernel-source/out/arch/arm64/boot/Image

      - name: Orijinal DTB Dosyalarını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: godmode-biloba-dtb
          path: kernel-source/out/arch/arm64/boot/dts/**/*.dtb
