name: Biloba Kernel 4.19.256 Port & Build
# Senior Developer Grade Workflow - Redmi Note 8 (2021) / biloba / MT6768
# MediaTek Helio G85 - 7-Day Professional Port Pipeline

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Target kernel version (e.g., 4.19.256)'
        required: true
        default: '4.19.256'
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      with_kernelsu:
        description: 'Include KernelSU'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  # ─────────────────────────────────────────────────────────────
  # REPOSITORY CONFIGURATION
  # ─────────────────────────────────────────────────────────────
  BILOBA_KERNEL_URL: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource"
  BILOBA_KERNEL_BRANCH: "biloba-r-oss"
  MTK_MODULES_URL: "https://github.com/MiCode/MTK_kernel_modules"
  MTK_MODULES_BRANCH: "biloba-r-oss"

  # Upstream Linux 4.19.256 stable
  UPSTREAM_KERNEL_URL: "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
  UPSTREAM_KERNEL_TAG: "v4.19.256"

  # Toolchains
  AOSP_CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
  AOSP_CLANG_BRANCH: "android12-release"
  AOSP_CLANG_VERSION: "r416183b1"  # Clang 14.0.6 for Android 12/13

  GCC64_URL: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"
  GCC64_BRANCH: "android12-release"
  GCC32_URL: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9"
  GCC32_BRANCH: "android12-release"

  # Build Configuration
  ARCH: "arm64"
  DEFCONFIG: "biloba_defconfig"
  DEVICE: "biloba"
  SOC: "mt6768"

  # AnyKernel3 for packaging
  ANYKERNEL3_URL: "https://github.com/osm0sis/AnyKernel3"
  ANYKERNEL3_BRANCH: "master"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # STAGE 1: ENVIRONMENT SETUP & TOOLCHAIN ACQUISITION
  # ═══════════════════════════════════════════════════════════════
  setup:
    name: "🔧 Setup Environment"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      build_id: ${{ steps.vars.outputs.build_id }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Generate Build Variables
        id: vars
        run: |
          BUILD_ID="biloba-419256-$(date +%Y%m%d-%H%M%S)"
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-8)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "::notice::Build ID: $BUILD_ID"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq             bc bison build-essential ccache curl flex             g++-multilib gcc-multilib git gnupg gperf             imagemagick lib32ncurses5-dev lib32readline-dev             lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev             libssl-dev libxml2 libxml2-utils lzop pngcrush             rsync schedtool squashfs-tools xsltproc zip zlib1g-dev             libelf-dev libdw-dev dwarves python3 python3-pip             device-tree-compiler libfdt-dev
          pip3 install pyelftools

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-biloba-${{ github.run_id }}
          restore-keys: |
            ccache-biloba-

      - name: Configure ccache
        run: |
          ccache --max-size=10G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      - name: Cache Toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/toolchains/clang
            ${{ github.workspace }}/toolchains/gcc64
            ${{ github.workspace }}/toolchains/gcc32
          key: toolchains-clang-${{ env.AOSP_CLANG_VERSION }}-${{ github.run_id }}
          restore-keys: |
            toolchains-clang-${{ env.AOSP_CLANG_VERSION }}-

      - name: Download AOSP Clang Toolchain
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains/clang
          git clone --depth=1 -b ${{ env.AOSP_CLANG_BRANCH }}             ${{ env.AOSP_CLANG_URL }} clang-tmp
          CLANG_DIR=$(find clang-tmp -maxdepth 1 -type d -name "clang-${{ env.AOSP_CLANG_VERSION }}" | head -1)
          if [ -z "$CLANG_DIR" ]; then
            # Fallback: find any clang directory
            CLANG_DIR=$(find clang-tmp -maxdepth 1 -type d | grep clang | head -1)
          fi
          cp -r "$CLANG_DIR"/* toolchains/clang/
          rm -rf clang-tmp

      - name: Download GCC Toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains/gcc64 toolchains/gcc32
          git clone --depth=1 -b ${{ env.GCC64_BRANCH }} ${{ env.GCC64_URL }} toolchains/gcc64
          git clone --depth=1 -b ${{ env.GCC32_BRANCH }} ${{ env.GCC32_URL }} toolchains/gcc32

      - name: Verify Toolchains
        run: |
          export PATH="${{ github.workspace }}/toolchains/clang/bin:${{ github.workspace }}/toolchains/gcc64/bin:${{ github.workspace }}/toolchains/gcc32/bin:$PATH"
          echo "=== Clang Version ==="
          clang --version
          echo "=== GCC64 Version ==="
          aarch64-linux-android-gcc --version || aarch64-linux-gnu-gcc --version
          echo "=== GCC32 Version ==="
          arm-linux-androideabi-gcc --version || arm-linux-gnueabi-gcc --version

      - name: Upload Toolchains Artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolchains-${{ steps.vars.outputs.build_id }}
          path: toolchains/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════
  # STAGE 2: SOURCE ACQUISITION & PORTING PREPARATION
  # ═══════════════════════════════════════════════════════════════
  acquire-sources:
    name: "📥 Acquire & Prepare Sources"
    runs-on: ubuntu-22.04
    needs: setup
    timeout-minutes: 45
    outputs:
      kernel_path: ${{ steps.paths.outputs.kernel_path }}

    steps:
      - name: Restore Toolchains
        uses: actions/download-artifact@v4
        with:
          name: toolchains-${{ needs.setup.outputs.build_id }}
          path: toolchains/

      - name: Clone Upstream Linux 4.19.256
        run: |
          git clone --depth=1 --branch ${{ env.UPSTREAM_KERNEL_TAG }}             ${{ env.UPSTREAM_KERNEL_URL }} linux-upstream
          echo "Upstream kernel cloned successfully"
          ls linux-upstream/Makefile

      - name: Clone Biloba Kernel Source (Device-Specific)
        run: |
          git clone --depth=1 -b ${{ env.BILOBA_KERNEL_BRANCH }}             ${{ env.BILOBA_KERNEL_URL }} biloba-kernel
          echo "Biloba kernel source cloned"

      - name: Clone MTK Kernel Modules
        run: |
          git clone --depth=1 -b ${{ env.MTK_MODULES_BRANCH }}             ${{ env.MTK_MODULES_URL }} mtk-modules
          echo "MTK modules cloned"

      - name: Analyze Biloba-Specific Files
        id: analyze
        run: |
          echo "=== BILOBA DEVICE-SPECIFIC FILES ANALYSIS ==="
          echo ""
          echo "--- Device Tree Sources (DTS/DTB) ---"
          find biloba-kernel -path "*/boot/dts/*" -o -path "*/dts/mediatek/*" -o -path "*/dts/biloba*" 2>/dev/null | head -30
          echo ""
          echo "--- MT6768 / MT6769 Specific ---"
          find biloba-kernel -type d -name "*mt6768*" -o -name "*mt6769*" 2>/dev/null
          echo ""
          echo "--- Platform Drivers ---"
          find biloba-kernel/arch/arm64 -type d | grep -E "(mediatek|mtk|mt67)" | head -20
          echo ""
          echo "--- Configs ---"
          find biloba-kernel -name "*defconfig*" | grep -E "(biloba|mt6768)" | head -10
          echo ""
          echo "--- Headers ---"
          find biloba-kernel/include -name "*mt6768*" -o -name "*mediatek*" -o -name "*mtk*" 2>/dev/null | head -20

      - name: Identify Port Files
        id: paths
        run: |
          # Create the port workspace
          mkdir -p port-workspace

          # Copy upstream kernel as base
          cp -r linux-upstream/* port-workspace/
          cp -r linux-upstream/.git port-workspace/ 2>/dev/null || true

          echo "kernel_path=${{ github.workspace }}/port-workspace" >> $GITHUB_OUTPUT
          echo "Kernel workspace prepared at: ${{ github.workspace }}/port-workspace"

      - name: Upload Kernel Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-source-${{ needs.setup.outputs.build_id }}
          path: port-workspace/
          retention-days: 1

      - name: Upload Biloba Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biloba-source-${{ needs.setup.outputs.build_id }}
          path: biloba-kernel/
          retention-days: 1

      - name: Upload MTK Modules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtk-modules-${{ needs.setup.outputs.build_id }}
          path: mtk-modules/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════
  # STAGE 3: KERNEL PORTING - FILE MIGRATION & PATCHING
  # ═══════════════════════════════════════════════════════════════
  port-kernel:
    name: "🔀 Port Biloba → Linux 4.19.256"
    runs-on: ubuntu-22.04
    needs: [setup, acquire-sources]
    timeout-minutes: 60

    steps:
      - name: Restore All Sources
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Setup Port Workspace
        run: |
          # Restore kernel workspace
          mv artifacts/kernel-source-* port-workspace
          mv artifacts/biloba-source-* biloba-kernel
          mv artifacts/mtk-modules-* mtk-modules

          # Restore toolchains
          mv artifacts/toolchains-* toolchains

      - name: Port Device Tree Sources (DTS/DTB)
        run: |
          echo "=== PORTING DEVICE TREE SOURCES ==="

          # Find all biloba/mediatek device tree files
          BILOBA_DTS=$(find biloba-kernel -name "*.dts" -o -name "*.dtsi" -o -name "*.dtb" 2>/dev/null | grep -iE "(biloba|mt6768|mt6769|mediatek)" || true)

          if [ -n "$BILOBA_DTS" ]; then
            mkdir -p port-workspace/arch/arm64/boot/dts/mediatek
            for f in $BILOBA_DTS; do
              cp -v "$f" port-workspace/arch/arm64/boot/dts/mediatek/ 2>/dev/null || true
            done
          fi

          # Also check for dts in arch/arm/boot/dts
          BILOBA_DTS_ARM=$(find biloba-kernel/arch/arm -name "*.dts" -o -name "*.dtsi" 2>/dev/null | grep -iE "(biloba|mt6768|mediatek)" || true)
          if [ -n "$BILOBA_DTS_ARM" ]; then
            mkdir -p port-workspace/arch/arm/boot/dts
            for f in $BILOBA_DTS_ARM; do
              cp -v "$f" port-workspace/arch/arm/boot/dts/ 2>/dev/null || true
            done
          fi

          echo "Device tree files ported successfully"

      - name: Port Platform-Specific Headers
        run: |
          echo "=== PORTING PLATFORM HEADERS ==="

          # MediaTek platform headers
          MTK_HEADERS=$(find biloba-kernel/include -type f 2>/dev/null | grep -iE "(mediatek|mtk|mt6768)" || true)
          if [ -n "$MTK_HEADERS" ]; then
            mkdir -p port-workspace/include/linux/mediatek
            for f in $MTK_HEADERS; do
              cp -v "$f" port-workspace/include/linux/mediatek/ 2>/dev/null || true
            done
          fi

          # SOC-specific headers
          SOC_HEADERS=$(find biloba-kernel -path "*/include/*" -type f 2>/dev/null | grep -iE "(mt6768|mt6769|mt67xx|mediatek)" || true)
          for f in $SOC_HEADERS; do
            TARGET=$(echo "$f" | sed 's|.*biloba-kernel/||')
            mkdir -p "port-workspace/$(dirname $TARGET)"
            cp -v "$f" "port-workspace/$TARGET" 2>/dev/null || true
          done

          echo "Headers ported successfully"

      - name: Port ARM64 Architecture Files
        run: |
          echo "=== PORTING ARM64 ARCH FILES ==="

          # Port any biloba-specific arm64 files
          for subdir in "boot" "kernel" "mm" "lib"; do
            if [ -d "biloba-kernel/arch/arm64/$subdir" ]; then
              # Find biloba-specific files
              find biloba-kernel/arch/arm64/$subdir -type f 2>/dev/null | while read f; do
                TARGET=$(echo "$f" | sed 's|.*biloba-kernel/||')
                mkdir -p "port-workspace/$(dirname $TARGET)"
                cp -v "$f" "port-workspace/$TARGET" 2>/dev/null || true
              done
            fi
          done

          echo "ARM64 arch files ported"

      - name: Port Drivers
        run: |
          echo "=== PORTING DRIVERS ==="

          # MediaTek-specific drivers
          MTK_DRIVERS=$(find biloba-kernel/drivers -type d 2>/dev/null | grep -iE "(mediatek|mtk|mt6768)" || true)
          for d in $MTK_DRIVERS; do
            TARGET=$(echo "$d" | sed 's|.*biloba-kernel/||')
            mkdir -p "port-workspace/$TARGET"
            cp -rv "$d"/* "port-workspace/$TARGET/" 2>/dev/null || true
          done

          # Key subsystem drivers that might be biloba-specific
          for driver_dir in "clk" "cpufreq" "cpuidle" "devfreq" "dma" "gpu" "i2c" "irqchip"                             "mailbox" "media" "memory" "mmc" "mtd" "net" "pci" "perf" "phy"                             "pinctrl" "power" "pwm" "regulator" "reset" "rtc" "scsi" "soc"                             "spi" "staging" "thermal" "tty" "usb" "video" "watchdog"; do
            if [ -d "biloba-kernel/drivers/$driver_dir" ]; then
              # Find MTK-specific files within each driver category
              find biloba-kernel/drivers/$driver_dir -maxdepth 1 -type f 2>/dev/null | grep -iE "(mtk|mediatek|mt67)" | while read f; do
                cp -v "$f" "port-workspace/drivers/$driver_dir/" 2>/dev/null || true
              done
            fi
          done

          echo "Drivers ported successfully"

      - name: Port Core Subsystem Modifications
        run: |
          echo "=== PORTING CORE SUBSYSTEMS ==="

          # Port any modified core subsystem files
          for subsys in "kernel" "mm" "fs" "block" "crypto" "security" "sound" "net"; do
            if [ -d "biloba-kernel/$subsys" ]; then
              find biloba-kernel/$subsys -maxdepth 2 -type f -name "*.c" -o -name "*.h" 2>/dev/null |                 grep -iE "(mtk|mediatek|mt67|biloba)" | while read f; do
                TARGET=$(echo "$f" | sed 's|.*biloba-kernel/||')
                mkdir -p "port-workspace/$(dirname $TARGET)"
                cp -v "$f" "port-workspace/$TARGET" 2>/dev/null || true
              done
            fi
          done

          echo "Core subsystems ported"

      - name: Port Configuration Files
        run: |
          echo "=== PORTING CONFIGURATION FILES ==="

          # Find and port defconfigs
          DEFCONFIGS=$(find biloba-kernel -name "*defconfig*" 2>/dev/null | grep -iE "(biloba|mt6768)" || true)
          if [ -n "$DEFCONFIGS" ]; then
            mkdir -p port-workspace/arch/arm64/configs
            for f in $DEFCONFIGS; do
              cp -v "$f" port-workspace/arch/arm64/configs/ 2>/dev/null || true
            done
          fi

          # Also check for configs in other locations
          find biloba-kernel -name "Kconfig*" -o -name "*.config" 2>/dev/null | grep -iE "(mediatek|mtk|mt67)" | while read f; do
            TARGET=$(echo "$f" | sed 's|.*biloba-kernel/||')
            mkdir -p "port-workspace/$(dirname $TARGET)"
            cp -v "$f" "port-workspace/$TARGET" 2>/dev/null || true
          done

          echo "Configuration files ported"

      - name: Port MTK Kernel Modules
        run: |
          echo "=== PORTING MTK KERNEL MODULES ==="

          # MTK kernel modules (out-of-tree modules)
          if [ -d "mtk-modules" ]; then
            mkdir -p port-workspace/drivers/misc/mediatek
            cp -rv mtk-modules/* port-workspace/drivers/misc/mediatek/ 2>/dev/null || true
          fi

          echo "MTK modules ported"

      - name: Apply Version Patches
        run: |
          echo "=== APPLYING VERSION COMPATIBILITY PATCHES ==="

          cd port-workspace

          # Update Makefile to reflect 4.19.256
          sed -i 's/^VERSION = .*/VERSION = 4/' Makefile
          sed -i 's/^PATCHLEVEL = .*/PATCHLEVEL = 19/' Makefile
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 256/' Makefile

          # Add biloba identifier to EXTRAVERSION
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION = -biloba-port/' Makefile

          echo "Version patched to 4.19.256-biloba-port"
          head -10 Makefile

      - name: Merge Kconfig Changes
        run: |
          echo "=== MERGING KCONFIG CHANGES ==="

          # Merge any Kconfig changes from biloba into upstream
          find biloba-kernel -name "Kconfig" -o -name "Kconfig.debug" 2>/dev/null | while read f; do
            TARGET=$(echo "$f" | sed 's|.*biloba-kernel/||')
            if [ -f "port-workspace/$TARGET" ]; then
              # Simple merge: append biloba-specific entries
              echo "# Biloba-specific additions" >> "port-workspace/$TARGET"
              grep -iE "(mediatek|mtk|mt67|biloba)" "$f" 2>/dev/null >> "port-workspace/$TARGET" || true
            fi
          done

          echo "Kconfig merged"

      - name: Upload Ported Kernel
        uses: actions/upload-artifact@v4
        with:
          name: ported-kernel-${{ needs.setup.outputs.build_id }}
          path: port-workspace/
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════
  # STAGE 4: KERNEL CONFIGURATION
  # ═══════════════════════════════════════════════════════════════
  configure:
    name: "⚙️ Configure Kernel"
    runs-on: ubuntu-22.04
    needs: [setup, port-kernel]
    timeout-minutes: 30

    steps:
      - name: Restore Ported Kernel
        uses: actions/download-artifact@v4
        with:
          name: ported-kernel-${{ needs.setup.outputs.build_id }}
          path: port-workspace/

      - name: Restore Toolchains
        uses: actions/download-artifact@v4
        with:
          name: toolchains-${{ needs.setup.outputs.build_id }}
          path: toolchains/

      - name: Setup Build Environment
        run: |
          export PATH="${{ github.workspace }}/toolchains/clang/bin:${{ github.workspace }}/toolchains/gcc64/bin:${{ github.workspace }}/toolchains/gcc32/bin:$PATH"

          # Detect correct cross-compile prefix
          GCC64_PREFIX=$(ls toolchains/gcc64/bin/aarch64*gcc 2>/dev/null | head -1 | xargs basename | sed 's/gcc$//')
          GCC32_PREFIX=$(ls toolchains/gcc32/bin/arm*gcc 2>/dev/null | head -1 | xargs basename | sed 's/gcc$//')

          echo "GCC64_PREFIX=$GCC64_PREFIX" >> $GITHUB_ENV
          echo "GCC32_PREFIX=$GCC32_PREFIX" >> $GITHUB_ENV

      - name: Generate Default Config
        run: |
          cd port-workspace

          export PATH="${{ github.workspace }}/toolchains/clang/bin:${{ github.workspace }}/toolchains/gcc64/bin:${{ github.workspace }}/toolchains/gcc32/bin:$PATH"

          # Try to find the biloba defconfig
          DEFCONFIG_FILE=$(find arch/arm64/configs -name "*biloba*" -o -name "*mt6768*" 2>/dev/null | head -1)

          if [ -n "$DEFCONFIG_FILE" ]; then
            DEFCONFIG_NAME=$(basename "$DEFCONFIG_FILE")
            echo "Found defconfig: $DEFCONFIG_NAME"
          else
            # Fallback: use defconfig and add biloba options
            DEFCONFIG_NAME="defconfig"
            echo "Using default defconfig, will add biloba options"
          fi

          # Generate .config
          make ARCH=arm64                CC=clang                CROSS_COMPILE=${{ env.GCC64_PREFIX }}                CROSS_COMPILE_ARM32=${{ env.GCC32_PREFIX }}                CLANG_TRIPLE=aarch64-linux-gnu-                $DEFCONFIG_NAME

          echo "Config generated successfully"

      - name: Apply Biloba-Specific Config Options
        run: |
          cd port-workspace

          # Add essential MediaTek / Biloba config options
          cat >> .config << 'EOF'
          # MediaTek Platform
          CONFIG_ARCH_MEDIATEK=y
          CONFIG_MTK_PLATFORM=y
          CONFIG_MTK_SOC_MT6768=y

          # Device Tree
          CONFIG_OF=y
          CONFIG_OF_FLATTREE=y
          CONFIG_OF_EARLY_FLATTREE=y
          CONFIG_OF_ADDRESS=y
          CONFIG_OF_IRQ=y
          CONFIG_OF_NET=y
          CONFIG_OF_MDIO=y
          CONFIG_OF_RESERVED_MEM=y

          # Essential drivers
          CONFIG_MTK_UART=y
          CONFIG_MTK_I2C=y
          CONFIG_MTK_SPI=y
          CONFIG_MTK_PWM=y
          CONFIG_MTK_GPIO=y
          CONFIG_MTK_PMIC=y
          CONFIG_MTK_REGULATOR=y
          CONFIG_MTK_CLK=y
          CONFIG_MTK_IRQ=y

          # Power management
          CONFIG_CPU_FREQ=y
          CONFIG_CPU_FREQ_GOV_COMMON=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
          CONFIG_CPU_FREQ_GOV_POWERSAVE=y
          CONFIG_CPU_FREQ_GOV_USERSPACE=y
          CONFIG_CPU_FREQ_GOV_ONDEMAND=y
          CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_CPU_IDLE=y
          CONFIG_CPU_IDLE_MTK=y

          # Thermal
          CONFIG_THERMAL=y
          CONFIG_THERMAL_OF=y
          CONFIG_THERMAL_GOV_STEP_WISE=y
          CONFIG_THERMAL_GOV_FAIR_SHARE=y
          CONFIG_MTK_THERMAL=y

          # Memory
          CONFIG_MTK_SMI=y
          CONFIG_MTK_M4U=y
          CONFIG_MTK_CMDQ=y

          # Display
          CONFIG_MTK_FB=y
          CONFIG_MTK_DISP=y

          # Camera
          CONFIG_MTK_CAMERA=y
          CONFIG_VIDEO_MTK_ISP=y

          # Audio
          CONFIG_SND_SOC_MTK=y
          CONFIG_MTK_AUDIO=y

          # Connectivity
          CONFIG_MTK_WCN=y
          CONFIG_MTK_COMBO=y
          CONFIG_MTK_COMBO_CHIP_CONSYS_6768=y

          # USB
          CONFIG_USB_MTK_HDRC=y
          CONFIG_USB_MTK_OTG=y

          # Storage
          CONFIG_MMC_MTK=y
          CONFIG_MTK_UFS=y

          # Security
          CONFIG_MTK_TEE=y
          CONFIG_TRUSTONIC_TEE=y

          # Debug
          CONFIG_DEBUG_KERNEL=y
          CONFIG_DEBUG_FS=y

          # Build optimizations
          CONFIG_LTO_NONE=y
          EOF

          # Update config
          make ARCH=arm64 CC=clang olddefconfig

          echo "Biloba-specific config applied"

      - name: Upload Config
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config-${{ needs.setup.outputs.build_id }}
          path: port-workspace/.config
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════
  # STAGE 5: KERNEL COMPILATION
  # ═══════════════════════════════════════════════════════════════
  build:
    name: "🔨 Build Kernel (Image + DTB)"
    runs-on: ubuntu-22.04
    needs: [setup, configure]
    timeout-minutes: 120

    steps:
      - name: Restore Ported Kernel
        uses: actions/download-artifact@v4
        with:
          name: ported-kernel-${{ needs.setup.outputs.build_id }}
          path: port-workspace/

      - name: Restore Config
        uses: actions/download-artifact@v4
        with:
          name: kernel-config-${{ needs.setup.outputs.build_id }}
          path: port-workspace/

      - name: Restore Toolchains
        uses: actions/download-artifact@v4
        with:
          name: toolchains-${{ needs.setup.outputs.build_id }}
          path: toolchains/

      - name: Setup Build Environment
        run: |
          export PATH="${{ github.workspace }}/toolchains/clang/bin:${{ github.workspace }}/toolchains/gcc64/bin:${{ github.workspace }}/toolchains/gcc32/bin:$PATH"

          GCC64_PREFIX=$(ls toolchains/gcc64/bin/aarch64*gcc 2>/dev/null | head -1 | xargs basename | sed 's/gcc$//')
          GCC32_PREFIX=$(ls toolchains/gcc32/bin/arm*gcc 2>/dev/null | head -1 | xargs basename | sed 's/gcc$//')

          echo "GCC64_PREFIX=$GCC64_PREFIX" >> $GITHUB_ENV
          echo "GCC32_PREFIX=$GCC32_PREFIX" >> $GITHUB_ENV

          # Setup ccache
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=10G
          export CCACHE_DIR=$HOME/.ccache

      - name: Build Kernel Image
        run: |
          cd port-workspace

          export PATH="${{ github.workspace }}/toolchains/clang/bin:${{ github.workspace }}/toolchains/gcc64/bin:${{ github.workspace }}/toolchains/gcc32/bin:$PATH"
          export CCACHE_DIR=$HOME/.ccache

          echo "=== STARTING KERNEL BUILD ==="
          echo "Architecture: arm64"
          echo "Compiler: Clang + GCC"
          echo "Target: Image.gz-dtb"

          # Main build command
          make -j$(nproc --all)                ARCH=arm64                CC="ccache clang"                CXX="ccache clang++"                CROSS_COMPILE=${{ env.GCC64_PREFIX }}                CROSS_COMPILE_ARM32=${{ env.GCC32_PREFIX }}                CLANG_TRIPLE=aarch64-linux-gnu-                AR=llvm-ar                NM=llvm-nm                OBJCOPY=llvm-objcopy                OBJDUMP=llvm-objdump                STRIP=llvm-strip                LLVM=1                LLVM_IAS=1                Image.gz-dtb

          echo "=== BUILD COMPLETED ==="

      - name: Verify Build Outputs
        run: |
          cd port-workspace

          echo "=== BUILD OUTPUTS ==="
          ls -lah arch/arm64/boot/

          # Check for Image
          if [ -f "arch/arm64/boot/Image" ]; then
            echo "✅ Image found: $(ls -lh arch/arm64/boot/Image)"
          else
            echo "❌ Image not found"
          fi

          # Check for Image.gz
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            echo "✅ Image.gz found: $(ls -lh arch/arm64/boot/Image.gz)"
          else
            echo "❌ Image.gz not found"
          fi

          # Check for DTB
          DTB_COUNT=$(find arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | wc -l)
          if [ "$DTB_COUNT" -gt 0 ]; then
            echo "✅ DTB files found: $DTB_COUNT"
            find arch/arm64/boot/dts -name "*.dtb" -exec ls -lh {} \;
          else
            echo "⚠️ No DTB files found"
          fi

          # Check for Image.gz-dtb
          if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
            echo "✅ Image.gz-dtb found: $(ls -lh arch/arm64/boot/Image.gz-dtb)"
          fi

      - name: Show ccache Stats
        run: |
          ccache -s

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-${{ needs.setup.outputs.build_id }}
          path: |
            port-workspace/arch/arm64/boot/Image
            port-workspace/arch/arm64/boot/Image.gz
            port-workspace/arch/arm64/boot/Image.gz-dtb
            port-workspace/arch/arm64/boot/dts/**/*.dtb
            port-workspace/System.map
            port-workspace/vmlinux
          retention-days: 7
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════
  # STAGE 6: DTB EXTRACTION & VALIDATION
  # ═══════════════════════════════════════════════════════════════
  dtb-validation:
    name: "📋 Validate DTB Outputs"
    runs-on: ubuntu-22.04
    needs: [setup, build]
    timeout-minutes: 15

    steps:
      - name: Restore Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-build-${{ needs.setup.outputs.build_id }}
          path: build-out/

      - name: Install DTB Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler libfdt-dev

      - name: Validate DTB Files
        run: |
          echo "=== DTB VALIDATION ==="

          DTB_FILES=$(find build-out -name "*.dtb" 2>/dev/null)

          if [ -z "$DTB_FILES" ]; then
            echo "⚠️ No DTB files found in build output"
            exit 0
          fi

          for dtb in $DTB_FILES; do
            echo "--- Validating: $(basename $dtb) ---"

            # Check file size
            SIZE=$(stat -c%s "$dtb")
            echo "  Size: $SIZE bytes"

            # Validate with fdtdump
            if fdtdump "$dtb" > /dev/null 2>&1; then
              echo "  ✅ Valid DTB structure"
            else
              echo "  ❌ Invalid DTB structure"
            fi

            # Extract model info
            MODEL=$(fdtget "$dtb" / model 2>/dev/null || echo "N/A")
            echo "  Model: $MODEL"

            # Extract compatible
            COMPAT=$(fdtget "$dtb" / compatible 2>/dev/null || echo "N/A")
            echo "  Compatible: $COMPAT"

            echo ""
          done

      - name: Check Image.gz-dtb
        run: |
          if [ -f "build-out/Image.gz-dtb" ]; then
            echo "=== Image.gz-dtb Analysis ==="
            ls -lh build-out/Image.gz-dtb

            # Try to extract DTB from appended image
            FILE_SIZE=$(stat -c%s build-out/Image.gz-dtb)
            echo "Total size: $FILE_SIZE bytes"

            # The DTB is typically appended after the gzip kernel
            # Check for gzip magic
            if xxd -l 2 build-out/Image.gz-dtb | grep -q "1f 8b"; then
              echo "✅ Gzip header found"
            fi
          fi

  # ═══════════════════════════════════════════════════════════════
  # STAGE 7: PACKAGING WITH ANYKERNEL3
  # ═══════════════════════════════════════════════════════════════
  package:
    name: "📦 Package with AnyKernel3"
    runs-on: ubuntu-22.04
    needs: [setup, build, dtb-validation]
    timeout-minutes: 20

    steps:
      - name: Restore Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-build-${{ needs.setup.outputs.build_id }}
          path: build-out/

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 -b ${{ env.ANYKERNEL3_BRANCH }} ${{ env.ANYKERNEL3_URL }} anykernel3

      - name: Prepare AnyKernel3 for Biloba
        run: |
          cd anykernel3

          # Clean template files
          rm -f zImage Image* *.dtb dtb dtbo.img

          # Copy kernel image
          if [ -f "../build-out/Image.gz-dtb" ]; then
            cp ../build-out/Image.gz-dtb .
            KERNEL_FILE="Image.gz-dtb"
          elif [ -f "../build-out/Image.gz" ]; then
            cp ../build-out/Image.gz .
            KERNEL_FILE="Image.gz"
          elif [ -f "../build-out/Image" ]; then
            cp ../build-out/Image .
            KERNEL_FILE="Image"
          fi

          # Copy DTB files
          find ../build-out -name "*.dtb" -exec cp {} . \; 2>/dev/null || true

          # Update anykernel.sh for biloba
          cat > anykernel.sh << 'EOF'
          # AnyKernel3 Script for Redmi Note 8 (2021) - Biloba
          # Device: biloba (MT6768 / Helio G85)

          ## AnyKernel setup
          # begin properties
          properties() {           kernel.string=Custom Kernel for Redmi Note 8 (2021) by GitHub Actions;           do.devicecheck=1;           do.modules=0;           do.systemless=1;           do.cleanup=1;           do.cleanuponabort=0;           device.name1=biloba;           device.name2=Redmi Note 8 2021;           device.name3=MT6768;           device.name4=;           device.name5=;           supported.versions=11 - 13;           supported.patchlevels=;           }
          # end properties

          # shell variables
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          # import functions/variables and setup patching - see for reference
          . tools/ak3-core.sh;

          # boot install
          dump_boot; # use split_boot to skip ramdisk unpack, e.g. for devices with init_boot ramdisk

          write_boot;
          ## end boot install
          EOF

          # Create update-binary
          mkdir -p META-INF/com/google/android
          cat > META-INF/com/google/android/update-binary << 'EOF'
          #!/sbin/sh
          # AnyKernel3 Flash Script

          OUTFD=/proc/self/fd/$2;
          ZIPFILE="$3";

          ui_print() {
            echo -e "ui_print $1
          ui_print" > $OUTFD;
          }

          ui_print " "
          ui_print "================================"
          ui_print "  Custom Kernel for Biloba"
          ui_print "  Redmi Note 8 (2021)"
          ui_print "  MT6768 / Helio G85"
          ui_print "================================"
          ui_print " "

          # Extract and flash
          cd /tmp;
          rm -rf anykernel;
          mkdir anykernel;
          cd anykernel;

          unzip -o "$ZIPFILE";

          ui_print "Flashing kernel..."
          sh anykernel.sh;

          ui_print " "
          ui_print "Done!"
          ui_print " "

          exit 0;
          EOF
          chmod +x META-INF/com/google/android/update-binary

          # Create updater-script
          cat > META-INF/com/google/android/updater-script << 'EOF'
          # Dummy file - update-binary is used
          EOF

          echo "AnyKernel3 prepared for biloba"

      - name: Create Flashable ZIP
        run: |
          cd anykernel3

          ZIP_NAME="Biloba-Kernel-4.19.256-${{ needs.setup.outputs.build_id }}.zip"
          zip -r9 "$ZIP_NAME" . -x "*.zip" -x ".git/*"

          ls -lh "$ZIP_NAME"
          mv "$ZIP_NAME" ../

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-zip-${{ needs.setup.outputs.build_id }}
          path: "*.zip"
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # STAGE 8: RELEASE PUBLICATION
  # ═══════════════════════════════════════════════════════════════
  release:
    name: "🚀 Publish Release"
    runs-on: ubuntu-22.04
    needs: [setup, build, package]
    if: github.event.inputs.build_type == 'release'
    timeout-minutes: 15

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets

          # Copy kernel images
          find artifacts/kernel-build-* -type f \( -name "Image*" -o -name "*.dtb" \) -exec cp {} release-assets/ \;

          # Copy AnyKernel3 zip
          find artifacts/anykernel3-zip-* -name "*.zip" -exec cp {} release-assets/ \;

          ls -lah release-assets/

      - name: Generate Release Notes
        run: |
          cat > release-notes.md << EOF
          # Biloba Kernel 4.19.256 Port

          ## Device Information
          - **Device:** Redmi Note 8 (2021)
          - **Codename:** biloba
          - **SoC:** MediaTek Helio G85 (MT6768)
          - **Architecture:** ARM64

          ## Kernel Information
          - **Base:** Linux 4.19.256 (Stable)
          - **Source:** Xiaomi biloba-r-oss + MiCode MTK_kernel_modules
          - **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Build ID:** ${{ needs.setup.outputs.build_id }}
          - **Commit:** ${{ github.sha }}

          ## Build Configuration
          - **Compiler:** AOSP Clang ${{ env.AOSP_CLANG_VERSION }}
          - **Target:** Image.gz-dtb
          - **LTO:** Disabled (CONFIG_LTO_NONE)

          ## Files Included
          - \`Image\` - Raw kernel image
          - \`Image.gz\` - Compressed kernel image
          - \`Image.gz-dtb\` - Kernel with appended DTB
          - \`*.dtb\` - Device Tree Blobs
          - \`Biloba-Kernel-*.zip\` - Flashable AnyKernel3 package

          ## Installation
          1. Flash the AnyKernel3 ZIP via TWRP/recovery
          2. Or manually replace kernel in boot.img using magiskboot

          ## Warnings
          - This is a ported kernel. Backup your data before flashing.
          - Only for Redmi Note 8 (2021) - DO NOT flash on Snapdragon variant (ginkgo/willow).

          ## Credits
          - Xiaomi/MiCode for biloba-r-oss kernel source
          - Linux Stable team for 4.19.256
          - osm0sis for AnyKernel3
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: biloba-4.19.256-${{ needs.setup.outputs.build_id }}
          name: "Biloba Kernel 4.19.256 - ${{ needs.setup.outputs.build_id }}"
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════
  # STAGE 9: BUILD SUMMARY
  # ═══════════════════════════════════════════════════════════════
  summary:
    name: "📊 Build Summary"
    runs-on: ubuntu-22.04
    needs: [setup, build, dtb-validation, package]
    if: always()
    timeout-minutes: 10

    steps:
      - name: Build Summary
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║         BILOBA KERNEL 4.19.256 BUILD SUMMARY               ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Device:     Redmi Note 8 (2021) / biloba                    ║"
          echo "║  SoC:        MediaTek Helio G85 (MT6768)                     ║"
          echo "║  Kernel:     Linux 4.19.256                                  ║"
          echo "║  Build ID:   ${{ needs.setup.outputs.build_id }}             ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Stage Results:                                              ║"
          echo "║    - Setup:        ${{ needs.setup.result }}                 ║"
          echo "║    - Source Acq:    ${{ needs.acquire-sources.result }}      ║"
          echo "║    - Port:          ${{ needs.port-kernel.result }}          ║"
          echo "║    - Configure:    ${{ needs.configure.result }}             ║"
          echo "║    - Build:        ${{ needs.build.result }}                 ║"
          echo "║    - DTB Validate: ${{ needs.dtb-validation.result }}        ║"
          echo "║    - Package:      ${{ needs.package.result }}               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

      - name: Cleanup Artifacts (on failure)
        if: failure()
        run: |
          echo "Build failed. Check logs for details."
          echo "Artifacts will be retained for debugging."
