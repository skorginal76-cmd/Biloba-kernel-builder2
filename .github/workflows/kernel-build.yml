name: Biloba-R-OSS 4.14.186 Topological Virtual Mali-G810 Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel with Topological Virtual GPU
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

    - name: Clone Toolchain (Proton-Clang)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain

    - name: Clone Kernel Source (biloba-r-oss)
      run: |
        git clone --depth=1 -b biloba-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel-source

    - name: Apply Hotfixes for Compiler Errors
      working-directory: kernel-source
      run: |
          echo "=== 1. Crypto / Keyslot Manager Inline Fixes ==="
          sed -i 's/inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h || true
          sed -i 's/__always_inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h || true

          sed -i 's/inline void blk_crypto_flock/void blk_crypto_flock/g' include/linux/blk-crypto.h || true
          sed -i 's/__always_inline void blk_crypto_flock/void blk_crypto_flock/g' include/linux/blk-crypto.h || true

          echo "=== 2. Touchscreen Missing Firmware & Upgrade Bypass ==="
          # Firmware dizinlerini olustur
          DRV_FW_DIR="drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware"
          mkdir -p "$DRV_FW_DIR"
          mkdir -p include/firmware

          # Eksik firmware sanal (dummy) dosyalarini olustur
          touch "$DRV_FW_DIR/fw_sample.i"
          touch "$DRV_FW_DIR/fw_huaxing_v0c.i"
          touch include/firmware/fw_sample.i
          touch include/firmware/fw_huaxing_v0c.i

          # FTS_UPGRADE_FW_FILE makrosunu tırnak icinde gecerli bir yola bagla
          sed -i 's/#define FTS_UPGRADE_FW_FILE.*/#define FTS_UPGRADE_FW_FILE "include\/firmware\/fw_sample.i"/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_config.h || true
          sed -i 's/#define FTS_UPGRADE_FW2_FILE.*/#define FTS_UPGRADE_FW2_FILE "include\/firmware\/fw_sample.i"/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_config.h || true
          sed -i 's/#define FTS_UPGRADE_EN.*/#define FTS_UPGRADE_EN 0/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_config.h || true

          # focaltech_flash.c icindeki dinamik #include makrosunu dummy dosyaya yonlendir
          sed -i 's/#include FTS_UPGRADE_FW_FILE/#include "include\/firmware\/fw_sample.i"/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_flash.c || true

          echo "=== 3. Implicit-Int (Eksik Tip Bildirimi) Duzeltmeleri ==="
          sed -i 's/static prev_current = -1;/static int prev_current = -1;/' drivers/power/supply/mediatek/charger/smb1351-charger.c || true
          sed -i 's/extern tpd_gesture_flag;/extern int tpd_gesture_flag;/' drivers/misc/mediatek/video/mt6768/videox/disp_lcm.c || true

    - name: Disable -Werror (Uyarıları Güvenli Şekilde Görmezden Gel)
      working-directory: kernel-source
      run: |
        echo "--- Makefile/Kbuild icinde -Werror, -Werror=xxx ve -Werror-xxx varyantlari temizleniyor ---"
        # ESKI HATA: 'find . -type f -name Makefile -o -name Kbuild' ifadesinde -type f
        # sadece ilk -o koluna bagliydi; asil onemlisi eski sed SADECE ciplak "-Werror"
        # yakaliyordu. drivers/misc/mediatek/Makefile icinde "subdir-ccflags-y += -Werror"
        # satiri hic temizlenmiyordu ve bu satir gercek suclu. Kbuild, scripts/Makefile.lib
        # icinde derleme bayraklarini su sirayla birlestiriyor:
        #   KBUILD_CFLAGS (KCFLAGS burada) -> KBUILD_SUBDIR_CCFLAGS (subdir-ccflags-y) -> ccflags-y
        # yani subdir-ccflags-y += -Werror, asagidaki KCFLAGS="-Wno-error"'dan SONRA
        # komut satirina ekleniyor ve onu eziyor -> mtk_gpufreq_core.c'de
        # get_immediate_gpu_wrap / DRV_Reg32 / DRV_WriteReg32 / mtk_gpufreq_register
        # implicit-function-declaration hatasi olarak patliyor.
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) -print0 \
          | xargs -0 sed -i -E -e 's/(^|[[:space:]])-Werror([=-][A-Za-z0-9_-]+)?([[:space:]]|$)/\1\3/g' \
          || true

    - name: Apply Defconfig Patches & Dummy Files
      working-directory: kernel-source
      run: |
        echo "--- Dummy Header Dosyalari Olusturuluyor ---"
        mkdir -p drivers/misc/mediatek/include/

        # Gelistirilmis Dummy Thermal Header
        cat << 'EOF' > drivers/misc/mediatek/include/mtk_thermal.h
        #ifndef __MTK_THERMAL_DUMMY_H
        #define __MTK_THERMAL_DUMMY_H

        enum thermal_bank_name {
            THERMAL_BANK0 = 0,
            THERMAL_BANK1,
            THERMAL_BANK2,
            THERMAL_BANK3
        };

        struct TS_PTPOD {
            int ts_MTS;
            int ts_BTS;
        };

        static inline void get_thermal_slope_intercept(struct TS_PTPOD *ts_info, enum thermal_bank_name ts_bank) {
            if (ts_info) {
                ts_info->ts_MTS = 0;
                ts_info->ts_BTS = 0;
            }
        }
        #endif
        EOF

        # Dummy CMDQ Header
        echo "#ifndef __MTK_CMDQ_DUMMY_H" > drivers/misc/mediatek/include/mtk-cmdq.h
        echo "#define __MTK_CMDQ_DUMMY_H" >> drivers/misc/mediatek/include/mtk-cmdq.h
        echo "#endif" >> drivers/misc/mediatek/include/mtk-cmdq.h

        echo "--- 8GB ZRAM Yamasi Uygulaniyor ---"
        if [ -f drivers/block/zram/zram_drv.c ]; then
          sed -i 's/default_disksize = .*/default_disksize = 8589934592ULL; /g' drivers/block/zram/zram_drv.c
          sed -i 's/mem_limit = .*/mem_limit = 6442450944ULL; /g' drivers/block/zram/zram_drv.c
        fi

        echo "--- Stack Protector Kapatiliyor & ZRAM Aktif Ediliyor ---"
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' arch/arm64/configs/biloba_defconfig
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/biloba_defconfig
        echo "CONFIG_ZRAM=y" >> arch/arm64/configs/biloba_defconfig
        echo "CONFIG_ZSMALLOC=y" >> arch/arm64/configs/biloba_defconfig

    - name: Inject Virtual Mali-G810 Topology & Mapper Drivers
      working-directory: kernel-source
      run: |
        echo "--- Topological Virtual Mali-G810 C Dosyalari Olusturuluyor ---"
        mkdir -p drivers/misc/virtual_mali/

        # 1. Ortak Header Dosyası
        cat << 'EOF' > drivers/misc/virtual_mali/virtual_mali.h
        #ifndef __VIRTUAL_MALI_H
        #define __VIRTUAL_MALI_H

        #include <linux/types.h>

        struct mali_g810_topology_specs {
            char architecture[32];
            char model_name[32];
            u32 core_count;
            u32 execution_engines;
            u32 max_clock_mhz;
            u32 l2_cache_size_kb;
            u32 bus_width_bits;
            u32 vulkan_api_version;
            u32 opengl_es_version;
            u64 virt_vram_bytes;
        };

        struct mali_g810_topology_specs* get_mali_g810_specs(void);

        #endif
        EOF

        # 2. Mali-G810 Topoloji ve Donanım Sürücüsü
        cat << 'EOF' > drivers/misc/virtual_mali/virtual_mali_g810.c
        #include <linux/module.h>
        #include <linux/platform_device.h>
        #include <linux/slab.h>
        #include "virtual_mali.h"

        static struct mali_g810_topology_specs g810_specs = {
            .architecture = "ARM Valhall Architecture",
            .model_name = "Mali-G810 Topologic vGPU",
            .core_count = 10,
            .execution_engines = 32,
            .max_clock_mhz = 950,
            .l2_cache_size_kb = 2048,
            .bus_width_bits = 256,
            .vulkan_api_version = 0x00403000,
            .opengl_es_version = 32,
            .virt_vram_bytes = 2147483648ULL
        };

        struct mali_g810_topology_specs* get_mali_g810_specs(void) {
            return &g810_specs;
        }
        EXPORT_SYMBOL_GPL(get_mali_g810_specs);

        static int virt_mali_g810_probe(struct platform_device *pdev) {
            pr_info("[MALI-G810-TOPOLOGY] Donanim Topolojisi Yuklendi.\n");
            pr_info("[MALI-G810-TOPOLOGY] Cihaz: %s | Mimari: %s\n", g810_specs.model_name, g810_specs.architecture);
            pr_info("[MALI-G810-TOPOLOGY] Core: %d Cores @ %d MHz | L2 Cache: %d KB\n",
                    g810_specs.core_count, g810_specs.max_clock_mhz, g810_specs.l2_cache_size_kb);
            pr_info("[MALI-G810-TOPOLOGY] Desteklenen API: Vulkan 1.3 / OpenGL ES 3.2\n");
            return 0;
        }

        static struct platform_driver virt_mali_g810_driver = {
            .probe = virt_mali_g810_probe,
            .driver = {
                .name = "virt_mali_g810_device",
                .owner = THIS_MODULE,
            },
        };

        module_platform_driver(virt_mali_g810_driver);
        MODULE_AUTHOR("Serhat");
        MODULE_DESCRIPTION("ARM Mali-G810 Hardware Topology Definition");
        MODULE_LICENSE("GPL");
        EOF

        # 3. Virtual GPU Mapper Sürücüsü (Misc Device Interface)
        cat << 'EOF' > drivers/misc/virtual_mali/virtual_gpu_mapper.c
        #include <linux/module.h>
        #include <linux/platform_device.h>
        #include <linux/miscdevice.h>
        #include <linux/fs.h>
        #include <linux/slab.h>
        #include "virtual_mali.h"

        static int virt_gpu_open(struct inode *inode, struct file *file) {
            return 0;
        }

        static int virt_gpu_release(struct inode *inode, struct file *file) {
            return 0;
        }

        static const struct file_operations virt_gpu_fops = {
            .owner = THIS_MODULE,
            .open = virt_gpu_open,
            .release = virt_gpu_release,
        };

        static struct miscdevice virt_mali_misc_dev = {
            .minor = MISC_DYNAMIC_MINOR,
            .name = "mali_g810_vgpu",
            .fops = &virt_gpu_fops,
        };

        static struct platform_device *vgpu_pdev;

        static int __init virt_gpu_mapper_init(void) {
            struct mali_g810_topology_specs *specs = get_mali_g810_specs();
            int ret;

            pr_info("[VGPU-MAPPER] Ikinci Sanal GPU Kayit Ediliyor: %s\n", specs->model_name);

            vgpu_pdev = platform_device_register_simple("virt_mali_g810_device", -1, NULL, 0);
            if (IS_ERR(vgpu_pdev)) {
                pr_err("[VGPU-MAPPER] Platform cihaz kaydi basarisiz!\n");
                return PTR_ERR(vgpu_pdev);
            }

            ret = misc_register(&virt_mali_misc_dev);
            if (ret) {
                pr_err("[VGPU-MAPPER] Misc cihaz tescil edilemedi!\n");
                platform_device_unregister(vgpu_pdev);
                return ret;
            }

            pr_info("[VGPU-MAPPER] BASARILI! Ikinci Donanim Sanal GPU Olarak Eklendi: /dev/mali_g810_vgpu\n");
            return 0;
        }

        static void __exit virt_gpu_mapper_exit(void) {
            misc_deregister(&virt_mali_misc_dev);
            if (vgpu_pdev) {
                platform_device_unregister(vgpu_pdev);
            }
            pr_info("[VGPU-MAPPER] Ikinci Sanal GPU Kaldirildi.\n");
        }

        module_init(virt_gpu_mapper_init);
        module_exit(virt_gpu_mapper_exit);
        MODULE_AUTHOR("Serhat");
        MODULE_DESCRIPTION("Topological Virtual GPU Mapper");
        MODULE_LICENSE("GPL");
        EOF

        # 4. Makefile Bağlantısı
        echo "obj-y += virtual_mali_g810.o" > drivers/misc/virtual_mali/Makefile
        echo "obj-y += virtual_gpu_mapper.o" >> drivers/misc/virtual_mali/Makefile

        echo "obj-y += virtual_mali/" >> drivers/misc/Makefile

    - name: Provide Missing MTK Register R/W Symbols
      working-directory: kernel-source
      run: |
        echo "--- DRV_Reg32 / DRV_WriteReg32 Eksik Sembolleri (mtk_gpufreq_core.c linker hatasi) ---"
        cat << 'EOF' > drivers/misc/mtk_reg_rw_stub.c
        #include <linux/kernel.h>
        #include <linux/io.h>
        #include <linux/export.h>

        unsigned int DRV_Reg32(unsigned int addr)
        {
            return __raw_readl((void __iomem *)(unsigned long)addr);
        }
        EXPORT_SYMBOL(DRV_Reg32);

        void DRV_WriteReg32(unsigned int addr, unsigned int val)
        {
            __raw_writel(val, (void __iomem *)(unsigned long)addr);
        }
        EXPORT_SYMBOL(DRV_WriteReg32);
        EOF

        echo "obj-y += mtk_reg_rw_stub.o" >> drivers/misc/Makefile

    - name: Build Kernel (Image & DTBs)
      working-directory: kernel-source
      run: |
        set -o pipefail

        export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64

        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        export HOSTCC=gcc
        export HOSTCXX=g++
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export KCFLAGS="-Wno-error -fgnu89-inline -Wno-error=implicit-int -Wno-error=implicit-function-declaration"
        export HOSTCFLAGS="-Wno-deprecated-declarations -Wno-error"

        make O=out biloba_defconfig 2>&1 | tee build.log
        make O=out Image Image.gz dtbs -j$(nproc --all) 2>&1 | tee -a build.log

    - name: Upload Build Log Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: kernel-source/build.log

    - name: Upload Kernel & DTB Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Biloba-Kernel-Image-And-DTB
        path: |
          kernel-source/out/arch/arm64/boot/Image
          kernel-source/out/arch/arm64/boot/Image.gz
          kernel-source/out/arch/arm64/boot/Image.gz-dtb
          kernel-source/out/arch/arm64/boot/dts/mediatek/*.dtb
          
