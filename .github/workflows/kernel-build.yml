name: Biloba-R-OSS 4.14.186 Topological Virtual Mali-G810 Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel with Topological Virtual GPU
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

    - name: Clone Toolchain (Proton-Clang)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain

    - name: Clone Kernel Source (biloba-r-oss)
      run: |
        git clone --depth=1 -b biloba-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel-source

    - name: Inject 2 Dummy Files & 8GB ZRAM Patch
      working-directory: kernel-source
      run: |
        echo "--- Dummy Header Dosyalari Olusturuluyor ---"
        mkdir -p drivers/misc/mediatek/include/
        
        echo "#ifndef __MTK_THERMAL_DUMMY_H" > drivers/misc/mediatek/include/mtk_thermal.h
        echo "#define __MTK_THERMAL_DUMMY_H" >> drivers/misc/mediatek/include/mtk_thermal.h
        echo "#endif" >> drivers/misc/mediatek/include/mtk_thermal.h
        
        echo "#ifndef __MTK_CMDQ_DUMMY_H" > drivers/misc/mediatek/include/mtk-cmdq.h
        echo "#define __MTK_CMDQ_DUMMY_H" >> drivers/misc/mediatek/include/mtk-cmdq.h
        echo "#endif" >> drivers/misc/mediatek/include/mtk-cmdq.h

        echo "--- 8GB ZRAM Yamasi Uygulaniyor ---"
        if [ -f drivers/block/zram/zram_drv.c ]; then
          sed -i 's/default_disksize = .*/default_disksize = 8589934592ULL; /g' drivers/block/zram/zram_drv.c
          sed -i 's/mem_limit = .*/mem_limit = 6442450944ULL; /g' drivers/block/zram/zram_drv.c
        fi

        echo "CONFIG_ZRAM=y" >> arch/arm64/configs/biloba_defconfig
        echo "CONFIG_ZSMALLOC=y" >> arch/arm64/configs/biloba_defconfig

    - name: Inject Virtual Mali-G810 Topology & Mapper Drivers
      working-directory: kernel-source
      run: |
        echo "--- Topological Virtual Mali-G810 C Dosyalari Olusturuluyor ---"
        mkdir -p drivers/gpu/drm/virtual_mali/

        # 1. Mali-G810 Teknik Özelliklerini ve Topolojisini Tanımlayan .c Dosyası
        cat << 'EOF' > drivers/gpu/drm/virtual_mali/virtual_mali_g810.c
        #include <linux/module.h>
        #include <linux/platform_device.h>
        #include <linux/slab.h>

        struct mali_g810_topology_specs {
            char architecture[32];    
            char model_name[32];      
            u32 core_count;           
            u32 execution_engines;    
            u32 max_clock_mhz;        
            u32 l2_cache_size_kb;     
            u32 bus_width_bits;       
            u32 vulkan_api_version;   
            u32 opengl_es_version;    
            u64 virt_vram_bytes;      
        };

        static struct mali_g810_topology_specs g810_specs = {
            .architecture = "ARM Valhall Architecture",
            .model_name = "Mali-G810 Topologic vGPU",
            .core_count = 10,
            .execution_engines = 32,
            .max_clock_mhz = 950,
            .l2_cache_size_kb = 2048,
            .bus_width_bits = 256,
            .vulkan_api_version = 0x00403000,
            .opengl_es_version = 32,
            .virt_vram_bytes = 2147483648ULL
        };

        struct mali_g810_topology_specs* get_mali_g810_specs(void) {
            return &g810_specs;
        }
        EXPORT_SYMBOL_GPL(get_mali_g810_specs);

        static int virt_mali_g810_probe(struct platform_device *pdev) {
            pr_info("[MALI-G810-TOPOLOGY] Donanim Topolojisi Yuklendi.\n");
            pr_info("[MALI-G810-TOPOLOGY] Cihaz: %s | Mimari: %s\n", g810_specs.model_name, g810_specs.architecture);
            pr_info("[MALI-G810-TOPOLOGY] Core: %d Cores @ %d MHz | L2 Cache: %d KB\n", 
                    g810_specs.core_count, g810_specs.max_clock_mhz, g810_specs.l2_cache_size_kb);
            pr_info("[MALI-G810-TOPOLOGY] Desteklenen API: Vulkan 1.3 / OpenGL ES 3.2\n");
            return 0;
        }

        static struct platform_driver virt_mali_g810_driver = {
            .probe = virt_mali_g810_probe,
            .driver = {
                .name = "virt_mali_g810_device",
                .owner = THIS_MODULE,
            },
        };

        module_platform_driver(virt_mali_g810_driver);
        MODULE_AUTHOR("Serhat");
        MODULE_DESCRIPTION("ARM Mali-G810 Hardware Topology Definition");
        MODULE_LICENSE("GPL");
        EOF

        # 2. Donanım Teknik Özelliklerini DRM Sistemine İkinci GPU Olarak Tescil Eden Mapper .c Dosyası
        cat << 'EOF' > drivers/gpu/drm/virtual_mali/virtual_gpu_mapper.c
        #include <linux/module.h>
        #include <drm/drmP.h>
        #include <drm/drm_drv.h>
        #include <drm/drm_gem.h>

        struct mali_g810_topology_specs {
            char architecture[32];
            char model_name[32];
            u32 core_count;
            u32 execution_engines;
            u32 max_clock_mhz;
            u32 l2_cache_size_kb;
            u32 bus_width_bits;
            u32 vulkan_api_version;
            u32 opengl_es_version;
            u64 virt_vram_bytes;
        };

        extern struct mali_g810_topology_specs* get_mali_g810_specs(void);

        static const struct file_operations virt_gpu_fops = {
            .owner = THIS_MODULE,
            .open = drm_open,
            .release = drm_release,
            .unlocked_ioctl = drm_ioctl,
            .mmap = drm_gem_mmap,
        };

        static struct drm_driver virt_mali_drm_driver = {
            .driver_features = DRIVER_GEM | DRIVER_RENDER | DRIVER_ATOMIC,
            .fops = &virt_gpu_fops,
            .name = "mali_g810_vgpu",
            .desc = "ARM Mali-G810 Virtual Second Graphics Adapter",
            .date = "20260803",
            .major = 1,
            .minor = 0,
        };

        static struct drm_device *vgpu_drm_dev;
        static struct platform_device *vgpu_pdev;

        static int __init virt_gpu_mapper_init(void) {
            struct mali_g810_topology_specs *specs = get_mali_g810_specs();
            int ret;

            pr_info("[VGPU-MAPPER] Ikinci Sanal GPU Kayit Ediliyor: %s\n", specs->model_name);

            vgpu_pdev = platform_device_register_simple("virt_mali_g810_device", -1, NULL, 0);
            if (IS_ERR(vgpu_pdev)) {
                pr_err("[VGPU-MAPPER] Platform cihaz kaydi basarisiz!\n");
                return PTR_ERR(vgpu_pdev);
            }

            vgpu_drm_dev = drm_dev_alloc(&virt_mali_drm_driver, &vgpu_pdev->dev);
            if (IS_ERR(vgpu_drm_dev)) {
                pr_err("[VGPU-MAPPER] DRM Cihaz tahsisi hatasi!\n");
                platform_device_unregister(vgpu_pdev);
                return PTR_ERR(vgpu_drm_dev);
            }

            ret = drm_dev_register(vgpu_drm_dev, 0);
            if (ret) {
                pr_err("[VGPU-MAPPER] DRM Cihazi sisteme tescil edilemedi!\n");
                drm_dev_put(vgpu_drm_dev);
                platform_device_unregister(vgpu_pdev);
                return ret;
            }

            pr_info("[VGPU-MAPPER] BASARILI! Ikinci Donanim Sanal GPU Olarak Eklendi: /dev/dri/renderD129\n");
            
            return 0;
        }

        static void __exit virt_gpu_mapper_exit(void) {
            if (vgpu_drm_dev) {
                drm_dev_unregister(vgpu_drm_dev);
                drm_dev_put(vgpu_drm_dev);
            }
            if (vgpu_pdev) {
                platform_device_unregister(vgpu_pdev);
            }
            pr_info("[VGPU-MAPPER] Ikinci Sanal GPU Kaldirildi.\n");
        }

        module_init(virt_gpu_mapper_init);
        module_exit(virt_gpu_mapper_exit);
        MODULE_AUTHOR("Serhat");
        MODULE_DESCRIPTION("Topological Virtual GPU Mapper for Second GPU Registration");
        MODULE_LICENSE("GPL");
        EOF

        # 3. Makefile Entegrasyonu
        echo "obj-y += virtual_mali_g810.o" > drivers/gpu/drm/virtual_mali/Makefile
        echo "obj-y += virtual_gpu_mapper.o" >> drivers/gpu/drm/virtual_mali/Makefile
        
        echo "ccflags-y := -Idrivers/gpu/drm" >> drivers/gpu/drm/virtual_mali/Makefile
        
        sed -i '$a obj-y += virtual_mali/' drivers/gpu/drm/Makefile

    - name: Build Kernel (Image & DTBs)
      working-directory: kernel-source
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        make O=out biloba_defconfig
        make O=out Image dtbs -j$(nproc --all)

    - name: Upload Kernel & DTB Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Biloba-Kernel-Image-And-DTB
        path: |
          kernel-source/out/arch/arm64/boot/Image
          kernel-source/out/arch/arm64/boot/Image.gz
          kernel-source/out/arch/arm64/boot/Image.gz-dtb
          kernel-source/out/arch/arm64/boot/dts/mediatek/*.dtb
