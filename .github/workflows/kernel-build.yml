      - name: Resmi Google AOSP Clang Indir (Sadece Frontend)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android11-release $CLANG_DIR

      - name: Otomatik-Onarim Yardimci Scriptini Olustur
        run: |
          cat > "$GITHUB_WORKSPACE/parse_failed_dir.py" << 'PYEOF'
          import re

          pat = re.compile(r"scripts/Makefile\.build:\d+: (drivers/(?:misc/mediatek|power|usb|gpu/drm/mediatek|thermal|cpufreq|cpuidle|clk/mediatek|pinctrl/mediatek|mmc|spi|i2c|net|leds|watchdog|soc/mediatek|irqchip)[^ \]]*?)/[^/ \]]+\.o\] Error")
          found = None
          try:
              with open("build.log") as f:
                  for line in f:
                      m = pat.search(line)
                      if m:
                          found = m.group(1)
          except Exception:
              pass
          print(found or "")
          PYEOF
          echo "SUCCESS: parse_failed_dir.py olusturuldu"

      - name: Godmode 4.14.336 Derleme Baslat (Dogrudan Argumanli)
        run: |
          cd $KERNEL_DIR
          
          export PATH="$CLANG_DIR/clang-r383902b/bin:$PATH"
          
          mkdir -p out
          
          # Config'i uygula ve eski config ile senkronize et
          make O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" biloba_defconfig
          
          # Yeni config seceneklerini varsayilan degerlerle doldur (non-interactive)
          yes "" | make O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" oldconfig
          
          # Gereksiz upstream suruculeri kapat (telefon kerneli icin)
          ./scripts/config --file out/.config --disable CONFIG_MEDIA_RC_SUPPORT
          ./scripts/config --file out/.config --disable CONFIG_RC_CORE
          ./scripts/config --file out/.config --disable CONFIG_RC_DECODERS
          ./scripts/config --file out/.config --disable CONFIG_RC_DEVICES
          ./scripts/config --file out/.config --disable CONFIG_VIDEO_V4L2
          ./scripts/config --file out/.config --disable CONFIG_VIDEO_DEV
          ./scripts/config --file out/.config --disable CONFIG_DVB_CORE
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_AUDIO
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_US122L
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_USX2Y
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_CAIAQ
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_6FIRE
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_HIFACE
          ./scripts/config --file out/.config --disable CONFIG_SND_BCD2000
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_LINE6
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_POD
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_PODHD
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_TONEPORT
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_VARIAX
          ./scripts/config --file out/.config --disable CONFIG_SND_BCD2000
          ./scripts/config --file out/.config --disable CONFIG_MEDIA_SUPPORT
          ./scripts/config --file out/.config --disable CONFIG_VIDEO_V4L2_SUBDEV_API
          ./scripts/config --file out/.config --disable CONFIG_VIDEO_DEV
          ./scripts/config --file out/.config --disable CONFIG_VIDEO_V4L2
          ./scripts/config --file out/.config --disable CONFIG_DVB_CORE
          make O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" oldconfig
          
          # Belli baslica derin MTK-ozel bagimliligi (kernel/sched EAS core
          # yamalari, DVFSRC OPP tablolari vb.) oldugu bilinen ve dummy header
          # ile cozulemeyen modulleri onceden devre disi birak.
          disable_mtk_module() {
            local dir="$1"
            local reason="$2"
            if [ -d "$dir" ] && [ -f "$dir/Makefile" ]; then
              local parent_makefile
              parent_makefile="$(dirname "$dir")/Makefile"
              local subname
              subname="$(basename "$dir")"
              if [ -f "$parent_makefile" ]; then
                sed -i "s/.*\b${subname}\b.*/# &  (disabled for 4.14.336 port: ${reason})/" "$parent_makefile"
              fi
              echo "# ${subname} disabled for 4.14.336 port: ${reason}" > "$dir/Makefile"
              echo "obj-y :=" >> "$dir/Makefile"
              echo "  -> ${dir} devre disi birakildi (${reason})"
            fi
          }
          
          disable_mtk_module "drivers/misc/mediatek/performance/boost_ctrl/dram_ctrl" "missing helio-dvfsrc-opp.h / DVFSRC OPP tablolari"
          disable_mtk_module "drivers/misc/mediatek/performance/boost_ctrl/eas_ctrl" "MTK EAS scheduler core yamasi eksik (NR_CGROUP/EAS_*_KIR)"
          disable_mtk_module "drivers/misc/mediatek/performance/boost_ctrl/topo_ctrl" "MTK perfmgr topoloji globalleri eksik (perfmgr_clusters/cpu_mask)"
          # boost_ctrl altindaki diger alt moduller de ayni MTK-ozel EAS/perfmgr
          # cekirdek yamalarina (kernel/sched icine gomulu) bagimli olma egiliminde;
          # gorulmemis olsa bile onceden devre disi birakiliyor (yoksa fonksiyon
          # zaten no-op geciyor). Boylece her biri icin ayri ayri deneme-yanilma
          # dongusune girmiyoruz.
          disable_mtk_module "drivers/misc/mediatek/performance/boost_ctrl/cpu_ctrl" "MTK perfmgr cekirdek globalleri eksik olabilir"
          disable_mtk_module "drivers/misc/mediatek/performance/boost_ctrl/gpu_ctrl" "MTK perfmgr/Mali DVFS globalleri eksik olabilir"
          disable_mtk_module "drivers/misc/mediatek/performance/boost_ctrl/hps_ctrl" "MTK hotplug/perfmgr globalleri eksik olabilir"
          disable_mtk_module "drivers/misc/mediatek/performance/boost_ctrl/uclamp_ctrl" "MTK uclamp scheduler yamasi eksik olabilir"
          disable_mtk_module "drivers/misc/mediatek/performance/boost_ctrl/xgf_ctrl" "MTK xgf/game-adaptive scheduler yamasi eksik olabilir"
          disable_mtk_module "drivers/misc/mediatek/performance/boost_ctrl/loading_ctrl" "MTK perfmgr loading-tracking globalleri eksik olabilir"
          disable_mtk_module "drivers/misc/mediatek/performance/boost_ctrl/touch_boost" "MTK perfmgr touch-boost globalleri eksik olabilir"
          disable_mtk_module "drivers/misc/mediatek/performance/boost_ctrl/obsv_ctrl" "MTK perfmgr observer globalleri eksik olabilir"
          
          # OTOMATIK-ONARIMLI DERLEME DONGUSU
          # Yukaridaki liste bilinen sorunlu modulleri kapsar; ancak bu tip
          # "portlanan surucu agacinin disindaki derin MTK-core bagimliligi"
          # hatalari baska modullerde de (bugun bilmedigimiz) cikabilir.
          # Bu yuzden derlemeyi tek seferlik degil, basarisiz olan alt modulu
          # build.log'dan otomatik tespit edip devre disi birakarak yeniden
          # deneyen bir donguyle calistiriyoruz. Boylece gelecekte cikacak
          # benzer "drivers/misc/mediatek/... altinda undeclared identifier"
          # hatalari da elle mudahale gerekmeden kendini onarir.
          MAKE_ARGS=(O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error")
          MAX_RETRIES=40
          attempt=1
          BUILD_OK=0
          
          while [ "$attempt" -le "$MAX_RETRIES" ]; do
            echo "::group::Derleme denemesi #${attempt}"
            set +e
            make -j"$(nproc --all)" "${MAKE_ARGS[@]}" 2>&1 | tee build.log
            status="${PIPESTATUS[0]}"
            set -e
            echo "::endgroup::"
          
            if [ "$status" -eq 0 ]; then
              BUILD_OK=1
              break
            fi
          
            # build.log'dan basarisiz olan drivers/misc/mediatek alt modulunu
            # (kendi Makefile'i olan en derin dizini) cikarmaya calis
            FAILED_DIR=$(python3 "$GITHUB_WORKSPACE/parse_failed_dir.py")
          
            if [ -n "$FAILED_DIR" ] && [ -d "$FAILED_DIR" ] && [ -f "$FAILED_DIR/Makefile" ]; then
              echo "::warning::${FAILED_DIR} derlenemedi (deneme ${attempt}), devre disi birakilip yeniden denenecek"
              disable_mtk_module "$FAILED_DIR" "otomatik: derleme hatasi (deneme ${attempt})"
              attempt=$((attempt + 1))
              continue
            else
              echo "::error::Otomatik olarak izole edilemeyen bir derleme hatasi olustu (bilinen kaliba uymuyor)."
              break
            fi
          done
          
          if [ "$BUILD_OK" -ne 1 ]; then
            echo "::error::Derleme, otomatik onarim denemelerinden sonra basarisiz oldu (${attempt} deneme)."
            echo "::group::Son 50 hata satiri"
            grep -n -i "error:" build.log | tail -50 || true
            echo "::endgroup::"
            echo "::group::Son 100 derleme satiri"
            tail -100 build.log
            echo "::endgroup::"
            exit 1
          fi
          
          echo "SUCCESS: Derleme ${attempt}. denemede basarili oldu."

      - name: Derleme Dogrulama Kontrolu (Sanity Check)
        run: |
          if [ ! -f $KERNEL_DIR/out/arch/arm64/boot/Image ]; then
            echo "::error::Kritik Hata: Godmode 4.14.336 uretimi Image ciktisi uretemedi."
            exit 1
          fi

      - name: Derleme Logunu Yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel-source/build.log

      - name: Orijinal Image Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: godmode-biloba-4.14.336-Image
          path: kernel-source/out/arch/arm64/boot/Image

      - name: Orijinal DTB Dosyalarini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: godmode-biloba-4.14.336-dtb
          path: kernel-source/out/arch/arm64/boot/dts/**/*.dtb
