name: Biloba-R-OSS 4.14.186 Topological Virtual Mali-G810 Build (Ubuntu 20.04)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel with Topological Virtual GPU
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Prepare Ubuntu 20.04 Container Environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y sudo git curl tzdata

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Build Environment & Dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y \
          git ccache automake flex lzop bison gperf build-essential zip curl \
          zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
          squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng \
          maven libssl-dev pwgen libswitch-perl policycoreutils minicom \
          libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses-dev \
          x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev xsltproc unzip \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
          python3 python-is-python3 rsync kmod libelf-dev device-tree-compiler

    - name: Clone Toolchain (Proton-Clang)
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain

    - name: Clone Kernel Source (biloba-r-oss)
      run: |
        git clone --depth=1 -b biloba-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel-source

    - name: Apply Hotfixes for Compiler & Header Errors
      working-directory: kernel-source
      run: |
          echo "=== 1. Crypto / Keyslot Manager Inline Fixes ==="
          if [ -f include/linux/keyslot-manager.h ]; then
            sed -i 's/static inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h || true
          fi
          if [ -f block/keyslot-manager.c ]; then
            sed -i 's/inline void ksm_flock/void ksm_flock/g' block/keyslot-manager.c || true
          fi
          if [ -f include/linux/blk-crypto.h ]; then
            sed -i 's/static inline void blk_crypto_flock/void blk_crypto_flock/g' include/linux/blk-crypto.h || true
          fi
          if [ -f block/blk-crypto.c ]; then
            sed -i 's/inline void blk_crypto_flock/void blk_crypto_flock/g' block/blk-crypto.c || true
          fi

          echo "=== 2. Touchscreen Missing Firmware & Upgrade Bypass ==="
          DRV_FW_DIR="drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware"
          mkdir -p "$DRV_FW_DIR"
          mkdir -p include/firmware

          # C dizisi ilklendirmesinde sentaks hatasi vermemesi icin 0x00 icerigi yaziliyor
          echo "0x00" > "$DRV_FW_DIR/fw_sample.i"
          echo "0x00" > "$DRV_FW_DIR/fw_huaxing_v0c.i"
          echo "0x00" > include/firmware/fw_sample.i
          echo "0x00" > include/firmware/fw_huaxing_v0c.i

          sed -i 's/#define FTS_UPGRADE_FW_FILE.*/#define FTS_UPGRADE_FW_FILE "include\/firmware\/fw_sample.i"/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_config.h || true
          sed -i 's/#define FTS_UPGRADE_FW2_FILE.*/#define FTS_UPGRADE_FW2_FILE "include\/firmware\/fw_sample.i"/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_config.h || true
          sed -i 's/#define FTS_UPGRADE_EN.*/#define FTS_UPGRADE_EN 0/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_config.h || true

          sed -i 's/#include FTS_UPGRADE_FW_FILE/#include "include\/firmware\/fw_sample.i"/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_flash.c || true

    - name: Disable -Werror (Global Flags Clean)
      working-directory: kernel-source
      run: |
        echo "--- Makefile'lardaki bagimsiz -Werror Bayraklari Temizleniyor ---"
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i -e 's/ -Werror / /g' -e 's/ -Werror$//g' -e 's/^-Werror //g' -e 's/^-Werror$//g' {} +

    - name: Apply Defconfig Patches & Dummy Files
      working-directory: kernel-source
      run: |
        echo "--- Dummy Header Dosyalari Olusturuluyor ---"
        mkdir -p drivers/misc/mediatek/include/
        
        cat << 'EOF' > drivers/misc/mediatek/include/mtk_thermal.h
        #ifndef __MTK_THERMAL_DUMMY_H
        #define __MTK_THERMAL_DUMMY_H
        #endif
        EOF

        cat << 'EOF' > drivers/misc/mediatek/include/mtk-cmdq.h
        #ifndef __MTK_CMDQ_DUMMY_H
        #define __MTK_CMDQ_DUMMY_H
        #endif
        EOF

        echo "--- 8GB ZRAM Yamasi Uygulaniyor ---"
        if [ -f drivers/block/zram/zram_drv.c ]; then
          sed -i 's/default_disksize = .*/default_disksize = 8589934592ULL; /g' drivers/block/zram/zram_drv.c
          sed -i 's/mem_limit = .*/mem_limit = 6442450944ULL; /g' drivers/block/zram/zram_drv.c
        fi

        echo "--- Stack Protector Kapatiliyor & ZRAM Aktif Ediliyor ---"
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' arch/arm64/configs/biloba_defconfig
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/biloba_defconfig
        echo "CONFIG_ZRAM=y" >> arch/arm64/configs/biloba_defconfig
        echo "CONFIG_ZSMALLOC=y" >> arch/arm64/configs/biloba_defconfig

    - name: Inject Virtual Mali-G810 Topology & Mapper Drivers
      working-directory: kernel-source
      run: |
        echo "--- Topological Virtual Mali-G810 C Dosyalari Olusturuluyor ---"
        mkdir -p drivers/misc/virtual_mali/

        cat << 'EOF' > drivers/misc/virtual_mali/virtual_mali.h
        #ifndef __VIRTUAL_MALI_H
        #define __VIRTUAL_MALI_H

        #include <linux/types.h>

        struct mali_g810_topology_specs {
            char architecture[32];    
            char model_name[32];      
            u32 core_count;           
            u32 execution_engines;    
            u32 max_clock_mhz;        
            u32 l2_cache_size_kb;     
            u32 bus_width_bits;       
            u32 vulkan_api_version;   
            u32 opengl_es_version;    
            u64 virt_vram_bytes;      
        };

        struct mali_g810_topology_specs* get_mali_g810_specs(void);

        #endif
        EOF

        cat << 'EOF' > drivers/misc/virtual_mali/virtual_mali_g810.c
        #include <linux/module.h>
        #include <linux/platform_device.h>
        #include <linux/slab.h>
        #include "virtual_mali.h"

        static struct mali_g810_topology_specs g810_specs = {
            .architecture = "ARM Valhall Architecture",
            .model_name = "Mali-G810 Topologic vGPU",
            .core_count = 10,
            .execution_engines = 32,
            .max_clock_mhz = 950,
            .l2_cache_size_kb = 2048,
            .bus_width_bits = 256,
            .vulkan_api_version = 0x00403000,
            .opengl_es_version = 32,
            .virt_vram_bytes = 2147483648ULL
        };

        struct mali_g810_topology_specs* get_mali_g810_specs(void) {
            return &g810_specs;
        }
        EXPORT_SYMBOL_GPL(get_mali_g810_specs);

        static int virt_mali_g810_probe(struct platform_device *pdev) {
            pr_info("[MALI-G810-TOPOLOGY] Donanim Topolojisi Yuklendi.\n");
            pr_info("[MALI-G810-TOPOLOGY] Cihaz: %s | Mimari: %s\n", g810_specs.model_name, g810_specs.architecture);
            pr_info("[MALI-G810-TOPOLOGY] Core: %d Cores @ %d MHz | L2 Cache: %d KB\n", 
                    g810_specs.core_count, g810_specs.max_clock_mhz, g810_specs.l2_cache_size_kb);
            pr_info("[MALI-G810-TOPOLOGY] Desteklenen API: Vulkan 1.3 / OpenGL ES 3.2\n");
            return 0;
        }

        static struct platform_driver virt_mali_g810_driver = {
            .probe = virt_mali_g810_probe,
            .driver = {
                .name = "virt_mali_g810_device",
                .owner = THIS_MODULE,
            },
        };

        module_platform_driver(virt_mali_g810_driver);
        MODULE_AUTHOR("Serhat");
        MODULE_DESCRIPTION("ARM Mali-G810 Hardware Topology Definition");
        MODULE_LICENSE("GPL");
        EOF

        cat << 'EOF' > drivers/misc/virtual_mali/virtual_gpu_mapper.c
        #include <linux/module.h>
        #include <linux/platform_device.h>
        #include <linux/miscdevice.h>
        #include <linux/fs.h>
        #include <linux/slab.h>
        #include "virtual_mali.h"

        static int virt_gpu_open(struct inode *inode, struct file *file) {
            return 0;
        }

        static int virt_gpu_release(struct inode *inode, struct file *file) {
            return 0;
        }

        static const struct file_operations virt_gpu_fops = {
            .owner = THIS_MODULE,
            .open = virt_gpu_open,
            .release = virt_gpu_release,
        };

        static struct miscdevice virt_mali_misc_dev = {
            .minor = MISC_DYNAMIC_MINOR,
            .name = "mali_g810_vgpu",
            .fops = &virt_gpu_fops,
        };

        static struct platform_device *vgpu_pdev;

        static int __init virt_gpu_mapper_init(void) {
            struct mali_g810_topology_specs *specs = get_mali_g810_specs();
            int ret;

            pr_info("[VGPU-MAPPER] Ikinci Sanal GPU Kayit Ediliyor: %s\n", specs->model_name);

            vgpu_pdev = platform_device_register_simple("virt_mali_g810_device", -1, NULL, 0);
            if (IS_ERR(vgpu_pdev)) {
                pr_err("[VGPU-MAPPER] Platform cihaz kaydi basarisiz!\n");
                return PTR_ERR(vgpu_pdev);
            }

            ret = misc_register(&virt_mali_misc_dev);
            if (ret) {
                pr_err("[VGPU-MAPPER] Misc cihaz tescil edilemedi!\n");
                platform_device_unregister(vgpu_pdev);
                return ret;
            }

            pr_info("[VGPU-MAPPER] BASARILI! Ikinci Donanim Sanal GPU Olarak Eklendi: /dev/mali_g810_vgpu\n");
            return 0;
        }

        static void __exit virt_gpu_mapper_exit(void) {
            misc_deregister(&virt_mali_misc_dev);
            if (vgpu_pdev) {
                platform_device_unregister(vgpu_pdev);
            }
            pr_info("[VGPU-MAPPER] Ikinci Sanal GPU Kaldirildi.\n");
        }

        module_init(virt_gpu_mapper_init);
        module_exit(virt_gpu_mapper_exit);
        MODULE_AUTHOR("Serhat");
        MODULE_DESCRIPTION("Topological Virtual GPU Mapper");
        MODULE_LICENSE("GPL");
        EOF

        cat << 'EOF' > drivers/misc/virtual_mali/Makefile
        ccflags-y += -I$(srctree)/drivers/misc/virtual_mali
        obj-y += virtual_mali_g810.o
        obj-y += virtual_gpu_mapper.o
        EOF

        echo "obj-y += virtual_mali/" >> drivers/misc/Makefile

    - name: Build Kernel & Device Tree
      working-directory: kernel-source
      shell: bash
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        export HOSTCC=gcc
        export HOSTCXX=g++
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-mismatched-pointer-types -Wno-incompatible-pointer-types -fgnu89-inline"
        export HOSTCFLAGS="-Wno-deprecated-declarations -Wno-error"
        
        echo "=== 1. Defconfig Yapilandirmasi Yapiliyor ===" | tee build.log
        make O=out biloba_defconfig 2>&1 | tee -a build.log
        
        echo "=== 2. Çekirdek ve DTB Derlemesi Baslatiliyor ===" | tee -a build.log
        make O=out Image Image.gz dtbs -j$(nproc --all) 2>&1 | tee -a build.log

        echo "=== 3. Image.gz-dtb Yapilandırma Kontrolü ve Birleştirme ===" | tee -a build.log
        if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "[INFO] Image.gz-dtb doğrudan bulunamadı, DTB birleştirme işlemi uygulanıyor..." | tee -a build.log
          cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/mediatek/*.dtb > out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || true
        fi

    - name: Upload Kernel & DTB Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Biloba-Kernel-Image-DTB-And-Logs
        path: |
          kernel-source/build.log
          kernel-source/out/arch/arm64/boot/Image
          kernel-source/out/arch/arm64/boot/Image.gz
          kernel-source/out/arch/arm64/boot/Image.gz-dtb
          kernel-source/out/arch/arm64/boot/dts/mediatek/*.dtb
        if-no-files-found: warn
        
