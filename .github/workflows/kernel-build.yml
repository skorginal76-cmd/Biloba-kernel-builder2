name: Biloba-R-OSS 4.14.186 Build (No Virtual GPU, Ubuntu 20.04)

on:
  workflow_dispatch:
    inputs:
      stock_localversion:
        description: 'Orijinal stok kernelin LOCALVERSION eki (uname -r ciktisindaki "4.14.186" disinda kalan kisim). Vendor WiFi/BT .ko modullerinin bu kernel ile ayni vermagic e sahip olmasi icin kullanilir.'
        required: false
        default: '-perf-g831600317'

jobs:
  build:
    name: Build Kernel (No Virtual GPU)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Prepare Ubuntu 20.04 Container Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y sudo git curl tzdata

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment & Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git ccache automake flex lzop bison gperf build-essential zip curl \
            zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng \
            maven libssl-dev pwgen libswitch-perl policycoreutils minicom \
            libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev xsltproc unzip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            python3 python-is-python3 rsync kmod libelf-dev device-tree-compiler

      - name: Clone Toolchain (crDroid Clang 11.0.2 - 6573524)
        run: |
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6573524 toolchain

      - name: Clone Kernel Source (biloba-r-oss)
        run: |
          git clone --depth=1 -b biloba-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel-source

      - name: Clone & Place MTK Connectivity Kernel Modules (WiFi/BT Built-in Source)
        run: |
          echo "=== MTK_kernel_modules (biloba-r-oss) Klonlaniyor ==="
          git clone --depth=1 -b biloba-r-oss https://github.com/MiCode/MTK_kernel_modules.git mtk-kernel-modules-src

          echo "--- Kaynak, kernel-source Makefile'inin bekledigi TAM yola yerlestiriliyor ---"
          # drivers/misc/mediatek/connectivity/Makefile icindeki gercek mantik:
          #   ABS_PATH_TO_WMT_DRV = $(srctree)/../vendor/mediatek/kernel_modules/connectivity/common
          # yani kernel-source'un BIR UST dizininde (GITHUB_WORKSPACE/vendor/...)
          # bekleniyor, kernel-source'un ICINDE degil. Onceki blanket rsync
          # yanlis yere (kernel-source/connectivity) kopyaliyordu, hicbir etkisi
          # olmuyordu.
          mkdir -p vendor/mediatek/kernel_modules
          rsync -a --stats mtk-kernel-modules-src/ vendor/mediatek/kernel_modules/ | tee rsync_merge.log

          echo "--- Dogrulama: beklenen alt dizinler mevcut mu? ---"
          ls -la vendor/mediatek/kernel_modules/connectivity/ | tee mtk_modules_tree.log
          test -d vendor/mediatek/kernel_modules/connectivity/common && echo "[OK] common/ bulundu"
          test -d vendor/mediatek/kernel_modules/connectivity/wlan/adaptor && echo "[OK] wlan/adaptor bulundu"
          test -d vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m && echo "[OK] wlan/core/gen4m bulundu"

      - name: Apply Hotfixes for Compiler & Header Errors
        working-directory: kernel-source
        run: |
          echo "=== 1. Crypto / Keyslot Manager Inline Fixes ==="
          if [ -f include/linux/keyslot-manager.h ]; then
            sed -i 's/static inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h || true
          fi
          if [ -f block/keyslot-manager.c ]; then
            sed -i 's/inline void ksm_flock/void ksm_flock/g' block/keyslot-manager.c || true
          fi
          if [ -f include/linux/blk-crypto.h ]; then
            sed -i 's/static inline void blk_crypto_flock/void blk_crypto_flock/g' include/linux/blk-crypto.h || true
          fi
          if [ -f block/blk-crypto.c ]; then
            sed -i 's/inline void blk_crypto_flock/void blk_crypto_flock/g' block/blk-crypto.c || true
          fi

          echo "=== 2. Touchscreen Missing Firmware & Upgrade Bypass ==="
          DRV_FW_DIR="drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware"
          mkdir -p "$DRV_FW_DIR"
          mkdir -p include/firmware

          echo "0x00" > "$DRV_FW_DIR/fw_sample.i"
          echo "0x00" > "$DRV_FW_DIR/fw_huaxing_v0c.i"
          echo "0x00" > include/firmware/fw_sample.i
          echo "0x00" > include/firmware/fw_huaxing_v0c.i

          sed -i 's/#define FTS_UPGRADE_FW_FILE.*/#define FTS_UPGRADE_FW_FILE "include\/firmware\/fw_sample.i"/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_config.h || true
          sed -i 's/#define FTS_UPGRADE_FW2_FILE.*/#define FTS_UPGRADE_FW2_FILE "include\/firmware\/fw_sample.i"/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_config.h || true
          sed -i 's/#define FTS_UPGRADE_EN.*/#define FTS_UPGRADE_EN 0/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_config.h || true

          sed -i 's/#include FTS_UPGRADE_FW_FILE/#include "include\/firmware\/fw_sample.i"/g' drivers/input/touchscreen/mediatek/ft8719_spi/focaltech_flash.c || true

      - name: Fix mtk-vcu Makefile Duplicate Object Link
        working-directory: kernel-source
        run: |
          echo "=== mtk-vcu Makefile Duplicate Symbol Fix ==="
          MTK_VCU_MK="drivers/media/platform/mtk-vcu/Makefile"
          if [ -f "$MTK_VCU_MK" ]; then
            sed -i 's/obj-\$(CONFIG_VIDEO_MEDIATEK_VCU) += mtk-vcu.o mtk_vcodec_mem.o/obj-\$(CONFIG_VIDEO_MEDIATEK_VCU) += mtk-vcu.o/g' "$MTK_VCU_MK"
            sed -i 's/subdir-ccflags-y += -Werror/subdir-ccflags-y += /g' "$MTK_VCU_MK" || true
            echo "Fixed: $(grep 'CONFIG_VIDEO_MEDIATEK_VCU' $MTK_VCU_MK)"
          else
            echo "[UYARI] $MTK_VCU_MK bulunamadi!"
          fi

      - name: Apply mtk_eem.c Thermal Dummy Header Patch
        working-directory: kernel-source
        run: |
          echo "=== mtk_eem.c Termal Hatalari Icin Dummy Header Olusturuluyor ==="
          EEM_DIR="drivers/misc/mediatek/base/power/eem_v2/mt6768"
          EEM_FILE="$EEM_DIR/mtk_eem.c"

          if [ -f "$EEM_FILE" ]; then
            cat << 'EOF' > "$EEM_DIR/mtk_ts_ptpod_dummy.h"
          #ifndef __MTK_TS_PTPOD_DUMMY_H
          #define __MTK_TS_PTPOD_DUMMY_H

          enum thermal_bank_name {
              THERMAL_BANK0 = 0,
              THERMAL_BANK1,
              THERMAL_BANK2,
              THERMAL_BANK3,
          };

          struct TS_PTPOD {
              int ts_MTS;
              int ts_BTS;
          };

          #endif
          EOF
            sed -i '1i #include "mtk_ts_ptpod_dummy.h"' "$EEM_FILE"
            echo "Dummy header basariyla mtk_eem.c icine eklendi."
          else
            echo "[UYARI] $EEM_FILE bulunamadi!"
          fi

      - name: Disable -Werror (Global Flags Clean)
        working-directory: kernel-source
        run: |
          echo "--- Makefile'lardaki bagimsiz -Werror Bayraklari Temizleniyor ---"
          find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i -e 's/ -Werror / /g' -e 's/ -Werror$//g' -e 's/^-Werror //g' -e 's/^-Werror$//g' {} +

      - name: Apply Defconfig Patches & Dummy Files
        working-directory: kernel-source
        run: |
          echo "--- Dummy Header Dosyalari Olusturuluyor ---"
          mkdir -p drivers/misc/mediatek/include/

          cat << 'EOF' > drivers/misc/mediatek/include/mtk_thermal.h
          #ifndef __MTK_THERMAL_DUMMY_H
          #define __MTK_THERMAL_DUMMY_H
          #endif
          EOF

          cat << 'EOF' > drivers/misc/mediatek/include/mtk-cmdq.h
          #ifndef __MTK_CMDQ_DUMMY_H
          #define __MTK_CMDQ_DUMMY_H
          #endif
          EOF

          echo "--- 12GB ZRAM Varsayilan Disksize Yamasi Uygulaniyor ---"
          ZRAM_DRV="drivers/block/zram/zram_drv.c"
          if [ -f "$ZRAM_DRV" ]; then
            cat << 'EOF' > /tmp/zram_default_disksize.txt

          /* 12GB varsayilan disksize: userspace /sys/block/zramN/disksize
           * hicbir sey yazmasa bile zram_add() icinde otomatik ayarlanir. */
          {
                  u64 def_disksize = PAGE_ALIGN(12884901888ULL);
                  struct zcomp *def_comp;

                  if (zram_meta_alloc(zram, def_disksize)) {
                          def_comp = zcomp_create(zram->compressor);
                          if (!IS_ERR(def_comp)) {
                                  zram->comp = def_comp;
                                  barrier();
                                  zram->disksize = def_disksize;
                                  set_capacity(zram->disk, zram->disksize >> SECTOR_SHIFT);
                          } else {
                                  zram_meta_free(zram, def_disksize);
                          }
                  }
          }
          EOF
            sed -i '/strlcpy(zram->compressor, default_compressor, sizeof(zram->compressor));/r /tmp/zram_default_disksize.txt' "$ZRAM_DRV"
            echo "12GB varsayilan disksize enjekte edildi."
          else
            echo "[UYARI] $ZRAM_DRV bulunamadi!"
          fi

          echo "--- Stack Protector Kapatiliyor & ZRAM Aktif Ediliyor ---"
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' arch/arm64/configs/biloba_defconfig

          sed -i '/CONFIG_ZRAM/d' arch/arm64/configs/biloba_defconfig
          sed -i '/CONFIG_ZSMALLOC/d' arch/arm64/configs/biloba_defconfig

          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/biloba_defconfig
          echo "CONFIG_ZRAM=y" >> arch/arm64/configs/biloba_defconfig
          echo "CONFIG_ZSMALLOC=y" >> arch/arm64/configs/biloba_defconfig

      - name: Match Stock Kernel Vermagic (Vendor WiFi/BT .ko Uyumlulugu Icin)
        working-directory: kernel-source
        run: |
          echo "=== KRITIK: '+' Son Ekini Onlemek Icin .scmversion Enjekte Ediliyor ==="
          # scripts/setlocalversion, CONFIG_LOCALVERSION_AUTO kapali olsa BILE
          # git working tree'nin "dirty" (commit edilmemis degisiklik) olup
          # olmadigina git diff-index ile bakar ve dirty ise sonuna "+" ekler.
          # Biz sed ile kaynagi surekli patch'ledigimiz icin tree hep dirty
          # kaliyor -> uname -r'a otomatik "+" ekleniyor -> vermagic stok ile
          # ASLA birebir eslesmiyor. Bos .scmversion dosyasi koyunca script
          # git kontrolunu tamamen atlar, "+" hic eklenmez.
          touch .scmversion

          echo "=== LOCALVERSION_AUTO Kapatiliyor (Deterministik Surum Stringi) ==="
          sed -i '/CONFIG_LOCALVERSION_AUTO/d' arch/arm64/configs/biloba_defconfig
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> arch/arm64/configs/biloba_defconfig

          echo "=== LOCALVERSION Stok Degere Ayarlaniyor ==="
          sed -i '/^CONFIG_LOCALVERSION=/d' arch/arm64/configs/biloba_defconfig
          echo 'CONFIG_LOCALVERSION="${{ github.event.inputs.stock_localversion }}"' >> arch/arm64/configs/biloba_defconfig
          echo "LOCALVERSION ayarlandi: ${{ github.event.inputs.stock_localversion }}"

          echo "=== KRITIK: CONFIG_MODVERSIONS ve MODULE_SIG Kapatiliyor ==="
          # Vendor WiFi/BT .ko dosyalari stok kaynaktan derlendigi icin bizim
          # kaynagimizla sembol checksum'lari (CRC) tutmuyor. MODVERSIONS acikken
          # modprobe/insmod "disagrees about version of symbol" hatasiyla REDDEDIYOR
          # -> WiFi/BT/Hotspot hic ayaga kalkmiyor. Checksum kontrolunu tamamen
          # kaldiriyoruz ki vermagic string esitse modul yuklenebilsin.
          sed -i '/CONFIG_MODVERSIONS/d' arch/arm64/configs/biloba_defconfig
          echo "# CONFIG_MODVERSIONS is not set" >> arch/arm64/configs/biloba_defconfig

          sed -i '/CONFIG_MODULE_SIG/d' arch/arm64/configs/biloba_defconfig
          echo "# CONFIG_MODULE_SIG is not set" >> arch/arm64/configs/biloba_defconfig

          sed -i '/^CONFIG_MODULES=/d' arch/arm64/configs/biloba_defconfig
          echo "CONFIG_MODULES=y" >> arch/arm64/configs/biloba_defconfig

          echo "=== KRITIK: WiFi/BT/Hotspot Icin Built-in Combo Surucusu Aktif Ediliyor ==="
          # drivers/misc/mediatek/connectivity/Makefile icinde CONFIG_WLAN_DRV_BUILD_IN
          # varsayilan olarak KAPALI (yorum satirinda). Kapali oldugu surece
          # wmt_drv/wmt_chrdev_wifi/wlan_drv_gen4m sembolik link + obj-y bloğu
          # HIC calismiyor -> WiFi/BT stack'i kernelimizde tamamen yok oluyor,
          # cihaz stok /vendor/lib/modules/wmt_drv.ko'ya (bizim kernelimizle
          # asla CRC eslesmeyecek olan) bagimli kaliyor. Bunu acarak WiFi/BT'yi
          # ayri bir .ko olmadan DOGRUDAN vmlinux icine gomuyoruz - boylece
          # module_layout/vermagic sorunu kokten ortadan kalkiyor.
          sed -i '/CONFIG_WLAN_DRV_BUILD_IN/d' arch/arm64/configs/biloba_defconfig
          echo "CONFIG_WLAN_DRV_BUILD_IN=y" >> arch/arm64/configs/biloba_defconfig

          # Chip ve platform zaten stok defconfig'te dogru: CONFIG_MTK_COMBO=y,
          # CONFIG_MTK_COMBO_CHIP_CONSYS_6768=y, CONFIG_MTK_COMBO_WIFI=y.
          # Bunlari koruyoruz, sadece bulunduklarini teyit ediyoruz:
          grep -E "^CONFIG_MTK_COMBO" arch/arm64/configs/biloba_defconfig || echo "[UYARI] CONFIG_MTK_COMBO* satirlari defconfig'te yok, elle eklenmesi gerekebilir."

      - name: Fix Missing DRV_Reg32 / DRV_WriteReg32 Symbols
        working-directory: kernel-source
        run: |
          echo "=== mtk_gpufreq_core.c Inline IO Fix ==="

          cat << 'EOF' > drivers/misc/mediatek/include/mtk_typedefs.h
          #ifndef __MTK_TYPEDEFS_H__
          #define __MTK_TYPEDEFS_H__
          #include <linux/io.h>
          #include <linux/types.h>

          static inline u32 DRV_Reg32(const volatile void __iomem *addr)
          {
              return readl(addr);
          }

          static inline void DRV_WriteReg32(volatile void __iomem *addr, u32 val)
          {
              writel(val, addr);
          }

          static inline void DRV_SetReg32(volatile void __iomem *addr, u32 val)
          {
              writel(readl(addr) | val, addr);
          }

          static inline void DRV_ClrReg32(volatile void __iomem *addr, u32 val)
          {
              writel(readl(addr) & ~val, addr);
          }
          #endif /* __MTK_TYPEDEFS_H__ */
          EOF

          if ! grep -q "mtk_typedefs.h" drivers/misc/mediatek/base/power/mt6768/mtk_gpufreq_core.c; then
            sed -i '1i #include <mtk_typedefs.h>' drivers/misc/mediatek/base/power/mt6768/mtk_gpufreq_core.c
            echo "mtk_typedefs.h include edildi."
          fi

      - name: Build Kernel & Device Tree
        working-directory: kernel-source
        shell: bash
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH

          MAKE_ARGS="O=out ARCH=arm64 SUBARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc \
            HOSTCXX=g++"

          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-unknown-warning-option -fgnu89-inline -Wno-unused-function -Wno-unused-variable -Wno-declaration-after-statement -Wno-dangling-else"
          export HOSTCFLAGS="-Wno-deprecated-declarations -Wno-error"

          echo "=== 1. Defconfig Yapilandirmasi Yapiliyor ===" | tee build.log
          make $MAKE_ARGS biloba_defconfig 2>&1 | tee -a build.log

          echo "=== 2. Cekirdek ve DTB Derlemesi Baslatiliyor ===" | tee -a build.log
          make -j$(nproc --all) $MAKE_ARGS Image Image.gz dtbs 2>&1 | tee -a build.log

          echo "=== 3. Vendor Modulleri Derleme (WiFi/BT/Hotspot icin gerekli) ===" | tee -a build.log
          make -j$(nproc --all) $MAKE_ARGS modules 2>&1 | tee -a build.log
          mkdir -p out/modules_install
          make $MAKE_ARGS INSTALL_MOD_PATH=out/modules_install modules_install 2>&1 | tee -a build.log

          echo "=== 4. Vermagic Dogrulama ===" | tee -a build.log
          VERMAGIC=$(strings out/vmlinux 2>/dev/null | grep -m1 "vermagic=" || true)
          echo "Build vermagic: $VERMAGIC" | tee -a build.log
          echo "Beklenen (stok) LOCALVERSION: ${{ github.event.inputs.stock_localversion }}" | tee -a build.log
          if echo "$VERMAGIC" | grep -q '+'; then
            echo "[HATA] Vermagic hala '+' iceriyor! .scmversion calismadi, tree hala dirty." | tee -a build.log
          else
            echo "[OK] Vermagic '+' icermiyor." | tee -a build.log
          fi

          echo "=== 4b. WiFi/BT Built-in Derleme Dogrulamasi ===" | tee -a build.log
          echo "--- Sembolik Link Kontrolu (drivers/misc/mediatek/connectivity altinda) ---" | tee -a build.log
          ls -la drivers/misc/mediatek/connectivity/wmt_drv drivers/misc/mediatek/connectivity/wmt_chrdev_wifi drivers/misc/mediatek/connectivity/wlan_drv_gen4m 2>&1 | tee -a build.log
          echo "--- build.log Icinde wmt_drv/wlan_drv_gen4m Derleme Satirlari ---" | tee -a build.log
          grep -E "wmt_drv/|wlan_drv_gen4m/|wmt_chrdev_wifi/" build.log | tee wmt_build_evidence.log
          if [ -s wmt_build_evidence.log ]; then
            echo "[OK] WiFi/BT kaynaklari gercekten derleme surecine girdi." | tee -a build.log
          else
            echo "[HATA] WiFi/BT kaynaklari HIC derlenmedi! CONFIG_WLAN_DRV_BUILD_IN veya symlink calismamis olabilir." | tee -a build.log
          fi
          echo "--- vmlinux Icinde wmt/wlan Sembol Kontrolu ---" | tee -a build.log
          nm out/vmlinux 2>/dev/null | grep -iE "wmt_core_tx|wlan_drv_gen4m_init|mtk_wcn_wmt" | tee -a build.log || echo "[UYARI] vmlinux icinde beklenen wmt/wlan sembolleri bulunamadi." | tee -a build.log

          echo "=== 5. WiFi/BT/Combo Modul Teshisi ===" | tee -a build.log
          echo "--- Bu agactan gercekten derlenen WiFi/BT/combo ilgili .ko dosyalari: ---" | tee -a build.log
          find out/modules_install -iname "*.ko" | grep -iE "wmt|conn|combo|bt|wifi|wlan|fm|gps" | tee -a build.log || \
            echo "[UYARI] Bu isimlerde HICBIR modul bulunamadi! WiFi/BT surucusu bu acik kaynak agacinda YOK; vendor partitiondaki kapali kaynak (proprietary) .ko olabilir. Bu durumda kernel tarafinda vermagic ne kadar uyusursa uyussun, o .ko'lar bu build'den gelmiyor ve stok kernelin .ko'larini kullanmak zorundasin." | tee -a build.log
          echo "--- Tum derlenen modul sayisi: $(find out/modules_install -iname '*.ko' | wc -l) ---" | tee -a build.log

          echo "=== 6. Image.gz-dtb Yapilandirma Kontrolu ve Birlestirme ===" | tee -a build.log
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "[INFO] Image.gz-dtb dogrudan bulunamadi, DTB birlestirme islemi uygulaniyor..." | tee -a build.log
            cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/mediatek/*.dtb > out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || true
          fi

      - name: Upload Kernel & DTB Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Biloba-Kernel-Image-DTB-And-Logs
          path: |
            kernel-source/build.log
            kernel-source/out/arch/arm64/boot/Image
            kernel-source/out/arch/arm64/boot/Image.gz
            kernel-source/out/arch/arm64/boot/Image.gz-dtb
            kernel-source/out/arch/arm64/bo
