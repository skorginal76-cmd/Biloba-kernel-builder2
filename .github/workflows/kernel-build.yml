name: Godmode Biloba Kernel Build

on:
  workflow_dispatch:

env:
  XIAOMI_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  XIAOMI_BRANCH: biloba-r-oss
  KERNEL_DIR: ${{ github.workspace }}/kernel-source
  CLANG_DIR: ${{ github.workspace }}/aosp-clang

jobs:
  build-godmode:
    name: Bulletproof Native Build Stack
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v6

      - name: Native 64-Bit Çapraz Derleyicileri ve Bağımlılıkları Kur
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev lz4 lzip ninja-build \
            python3 python-is-python3 tar u-boot-tools xz-utils \
            zip zlib1g-dev libncurses5-dev libncurses5 libtinfo5 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            wget

      - name: Git Güvenlik Ayarını Yap
        run: |
          git config --global --add safe.directory '*'

      - name: Resmi Xiaomi Kernel Kaynağını Çek (MiCode)
        run: |
          git clone --depth=1 $XIAOMI_REPO -b $XIAOMI_BRANCH $KERNEL_DIR

      - name: OEM Eksik Firmware Yaması (Kapsamlı Dummy Injection)
        run: |
          cd $KERNEL_DIR
          echo "::group::Dokunmatik Panel (Focaltech) Firmware Yamaları"
          
          mkdir -p drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware
          
          # Ana varyantlar
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_huaxing_v0c.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_tianma_v0c.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_huaxing_v0d.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_tianma_v0d.i
          
          # Fixlenen sample dosyaları ve türevleri
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_sample.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_sample1.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_sample2.i
          
          echo "::endgroup::"

      - name: ZRAM Gelişmiş Kapasite ve Kullanım Yaması (8GB Disk / 6GB Limit)
        run: |
          cd $KERNEL_DIR
          echo "::group::ZRAM Çekirdek Seviyesi Sürücü Enjeksiyonu"
          
          python3 -c '
          import os
          filepath = "drivers/block/zram/zram_drv.c"
          if os.path.exists(filepath):
              with open(filepath, "r") as f:
                  code = f.read()
              
              # 1. Müdahale: disksize_store fonksiyonunun başına "8G" dayatması enjekte et
              if "static ssize_t disksize_store" in code:
                  pos = code.find("static ssize_t disksize_store")
                  brace = code.find("{", pos)
                  if brace != -1:
                      code = code[:brace+1] + "\n\tbuf = \"8G\";\n" + code[brace+1:]
              
              # 2. Müdahale: mem_limit_store fonksiyonunun başına "6G" dayatması enjekte et
              if "static ssize_t mem_limit_store" in code:
                  pos = code.find("static ssize_t mem_limit_store")
                  brace = code.find("{", pos)
                  if brace != -1:
                      code = code[:brace+1] + "\n\tbuf = \"6G\";\n" + code[brace+1:]
              
              # 3. Müdahale: Disk boyutu işlenirken fiziksel havuz limitini (6GB) garantiye al
              if "zram->disksize = disksize;" in code:
                  code = code.replace("zram->disksize = disksize;", "zram->disksize = disksize;\n\tzram->limit_pages = 6ULL * 1024 * 1024 * 1024 >> PAGE_SHIFT;")
              
              with open(filepath, "w") as f:
                  f.write(code)
              print("SUCCESS: ZRAM sürücüsü çekirdek düzeyinde 8GB Swap / 6GB Bellek Sınırı ile mühürlendi.")
          else:
              print("ERROR: zram_drv.c bulunamadı, yama uygulanamadı!")
              exit(1)
          '
          echo "::endgroup::"

      - name: Resmi Google AOSP Clang İndir (Sadece Frontend)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android11-release $CLANG_DIR

      - name: Godmode Derleme Başlat (Doğrudan Argümanlı)
        run: |
          cd $KERNEL_DIR
          
          export PATH="$CLANG_DIR/clang-r383902b/bin:$PATH"
          
          mkdir -p out
          
          make O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" biloba_defconfig
          
          make -j$(nproc --all) O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error"

      - name: Derleme Doğrulama Kontrolü (Sanity Check)
        run: |
          if [ ! -f $KERNEL_DIR/out/arch/arm64/boot/Image ]; then
            echo "::error::Kritik Hata: Godmode üretimi Image çıktısı üretemedi."
            exit 1
          fi

      - name: Orijinal Image Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: godmode-biloba-Image
          path: kernel-source/out/arch/arm64/boot/Image

      - name: Orijinal DTB Dosyalarını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: godmode-biloba-dtb
          path: kernel-source/out/arch/arm64/boot/dts/**/*.dtb
