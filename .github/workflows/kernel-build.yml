name: Godmode Biloba Kernel Build

on:
  workflow_dispatch:

env:
  XIAOMI_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  XIAOMI_BRANCH: biloba-r-oss
  KERNEL_DIR: ${{ github.workspace }}/kernel-source
  CLANG_DIR: ${{ github.workspace }}/aosp-clang

jobs:
  build-godmode:
    name: Bulletproof Native Build Stack
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v6

      - name: Native 64-Bit Çapraz Derleyicileri ve Bağımlılıkları Kur
        run: |
          sudo apt-get update -y
          # SENIOR FIX: Dışarıdan GCC indirmek yerine sistemin kendi %100 uyumlu 64-bit araçlarını kuruyoruz.
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev lz4 lzip ninja-build \
            python2 python3 tar u-boot-tools xz-utils \
            zip zlib1g-dev libncurses5-dev libncurses5 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            wget

      - name: Git Güvenlik Ayarını Yap
        run: |
          git config --global --add safe.directory '*'

      - name: Resmi Xiaomi Kernel Kaynağını Çek (MiCode)
        run: |
          git clone --depth=1 $XIAOMI_REPO -b $XIAOMI_BRANCH $KERNEL_DIR

      - name: Resmi Google AOSP Clang İndir (Sadece Frontend)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android11-release $CLANG_DIR

      - name: Godmode Derleme Başlat (Parametre Zorlamalı)
        run: |
          cd $KERNEL_DIR
          
          export PATH="$CLANG_DIR/clang-r383902b/bin:$PATH"
          
          # BÜTÜN DÜĞÜMÜ ÇÖZEN NOKTA: Makefile içindeki olası path hatalarını ezmek için komut içi (inline) argümanlar
          MAKE_ARGS="O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS=-w"
          
          mkdir -p out
          
          # Defconfig yapılandırmasını kur
          make $MAKE_ARGS biloba_defconfig
          
          # Bütün CPU gücüyle derle
          make -j$(nproc --all) $MAKE_ARGS

      - name: Derleme Doğrulama Kontrolü (Sanity Check)
        run: |
          if [ ! -f $KERNEL_DIR/out/arch/arm64/boot/Image ]; then
            echo "::error::Kritik Hata: Godmode üretimi Image çıktısı üretemedi."
            exit 1
          fi

      - name: Orijinal Image Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: godmode-biloba-Image
          path: kernel-source/out/arch/arm64/boot/Image

      - name: Orijinal DTB Dosyalarını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: godmode-biloba-dtb
          path: kernel-source/out/arch/arm64/boot/dts/**/*.dtb
