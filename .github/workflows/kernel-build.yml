name: Official Xiaomi Biloba Kernel Build (OEM Reference Stack)

on:
  workflow_dispatch:

env:
  TZ: Europe/Istanbul
  XIAOMI_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  XIAOMI_BRANCH: biloba-r-oss
  KERNEL_DIR: ${{ github.workspace }}/kernel-source
  CLANG_DIR: ${{ github.workspace }}/aosp-clang
  GCC64_DIR: ${{ github.workspace }}/gcc64
  GCC32_DIR: ${{ github.workspace }}/gcc32
  DEFCONFIG: biloba_defconfig

jobs:
  build-official:
    name: Build with Historical Android R Toolchains
    runs-on: ubuntu-latest
    
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v6

      - name: 32-bit Desteği ve Sistem Bağımlılıklarını Kur
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # 32-bit mimari desteğini sisteme tanıtıyoruz
          dpkg --add-architecture i386
          apt-get update -y
          
          # SENIOR FIX: GCC 4.9'un 32-bit binary'lerini 64-bit sistemde çalıştırmak için gerekli lib32 kütüphaneleri eklendi
          apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            lzip \
            ninja-build \
            python2 \
            python3 \
            tar \
            u-boot-tools \
            xz-utils \
            zip \
            zlib1g-dev \
            libncurses5-dev \
            libncurses5 \
            libtinfo5 \
            wget \
            libc6:i386 \
            libncurses5:i386 \
            libstdc++6:i386 \
            lib32z1

      - name: Git Güvenlik Ayarını Yap
        run: |
          git config --global --add safe.directory '*'

      - name: Resmi Xiaomi Kernel Kaynağını Çek (MiCode)
        run: |
          git clone --depth=1 $XIAOMI_REPO -b $XIAOMI_BRANCH $KERNEL_DIR

      - name: Resmi Google AOSP Clang ve LineageOS GCC Toolchainlerini İndir
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android11-release $CLANG_DIR
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git $GCC64_DIR
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git $GCC32_DIR

      - name: Orijinal Fabrika Standartlarında Derlemeyi Tetikle
        run: |
          cd $KERNEL_DIR
          
          export PATH="$CLANG_DIR/clang-r383902b/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:/usr/bin:$PATH"
          
          export ARCH=arm64
          export SUBARCH=arm64
          
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          export KCFLAGS="-w"
          
          mkdir -p out
          make O=out $DEFCONFIG
          make -j$(nproc --all) O=out

      - name: Derleme Doğrulama Kontrolü (Sanity Check)
        run: |
          if [ ! -f $KERNEL_DIR/out/arch/arm64/boot/Image ]; then
            echo "::error::Kritik Hata: Üretim döngüsü Image çıktısı üretemedi."
            exit 1
          fi

      - name: Orijinal Image Dosyasını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: stock-biloba-Image
          path: kernel-source/out/arch/arm64/boot/Image

      - name: Orijinal DTB Dosyalarını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: stock-biloba-dtb
          path: kernel-source/out/arch/arm64/boot/dts/**/*.dtb
