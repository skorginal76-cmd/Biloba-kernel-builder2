name: Official Xiaomi Biloba Kernel Build

on:
  workflow_dispatch:

env:
  TZ: Europe/Istanbul
  XIAOMI_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  XIAOMI_BRANCH: biloba-r-oss
  KERNEL_DIR: ${{ github.workspace }}/kernel-source
  TOOLCHAIN_DIR: ${{ github.workspace }}/proton-clang
  DEFCONFIG: biloba_defconfig

jobs:
  build-official:
    name: Fetch and Build from MiCode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v6

      - name: Sistem Bağımlılıklarını Kur (Noble Numbat Uyumlu)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            lzip \
            ninja-build \
            python3 \
            python-is-python3 \
            tar \
            u-boot-tools \
            xz-utils \
            zip \
            zlib1g-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Resmi Xiaomi Kernel Kaynağını Çek (MiCode)
        run: |
          git clone --depth=1 $XIAOMI_REPO -b $XIAOMI_BRANCH $KERNEL_DIR

      - name: Proton Clang Toolchain İndir ve Glibc Fix Uygula
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $TOOLCHAIN_DIR
          
          # KRİTİK FİX: Modern Ubuntu (glibc) üzerinde fixdep / hostcc hatalarını engellemek için
          # Proton Clang'in eski host linker'ını siliyoruz. Sistem yerel /usr/bin/ld'yi kullanacak.
          rm -f $TOOLCHAIN_DIR/bin/ld

      - name: Resmi Kerneli Derle
        run: |
          cd $KERNEL_DIR
          
          # Ortam değişkenleri ve Toolchain PATH optimizasyonu
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Clang LLVM derleme komut köprüleri
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          # GNU assembler referansları
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # İzole çıktı dizini oluşturma ve defconfig yükleme
          mkdir -p out
          make O=out $DEFCONFIG
          
          # Maksimum paralellikte derlemeyi tetikle
          make -j$(nproc --all) O=out

      - name: Derleme Doğrulama Kontrolü (Sanity Check)
        run: |
          if [ ! -f $KERNEL_DIR/out/arch/arm64/boot/Image ]; then
            echo "::error::Kritik Hata: Kernel derleme döngüsü tamamlandı fakat 'Image' çıktısı üretilemedi."
            exit 1
          fi

      - name: Resmi Image Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: official-biloba-Image
          path: kernel-source/out/arch/arm64/boot/Image

      - name: Resmi DTB Dosyalarını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: official-biloba-dtb
          path: kernel-source/out/arch/arm64/boot/dts/**/*.dtb
