name: Port and Build Biloba Kernel (Android 12 5.10)

on:
  workflow_dispatch:
    inputs:
      biloba_repo:
        description: 'Biloba R-OSS Repo URL'
        required: true
        default: 'https://github.com/MiCode/Xiaomi_Kernel_OpenSource'
      biloba_branch:
        description: 'Biloba R-OSS Branch'
        required: true
        default: 'biloba-r-oss'
      target_repo:
        description: 'Target Kernel Repo URL'
        required: true
        default: 'https://github.com/MillenniumOSS/android_kernel_common_android12-5.10'
      target_branch:
        description: 'Target Kernel Branch'
        required: true
        default: 'millennium-base'
      defconfig_name:
        description: 'Defconfig File Name'
        required: true
        default: 'biloba_defconfig'

jobs:
  port_and_build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison flex build-essential libssl-dev libncurses5-dev \
            git rsync wget tar unzip zip device-tree-compiler \
            libelf-dev ccache lz4 liblz4-tool python3 python-is-python3

      - name: Clone Proton Clang Toolchain
        run: |
          echo "==> Cloning Proton Clang toolchain..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain/clang

      - name: Clone Biloba R-OSS Kernel Source
        run: |
          echo "==> Cloning Biloba Source (${{ github.event.inputs.biloba_branch }})..."
          git clone --depth=1 -b ${{ github.event.inputs.biloba_branch }} ${{ github.event.inputs.biloba_repo }} biloba-source

      - name: Clone Target Android 12 (5.10) Common Kernel
        run: |
          echo "==> Cloning Target Kernel (${{ github.event.inputs.target_branch }})..."
          git clone --depth=1 -b ${{ github.event.inputs.target_branch }} ${{ github.event.inputs.target_repo }} target-kernel

      - name: Port Biloba Files into Target Kernel
        run: |
          SRC="$GITHUB_WORKSPACE/biloba-source"
          TGT="$GITHUB_WORKSPACE/target-kernel"

          echo "==> Starting Porting Process..."

          # 1. Defconfig & Vendor Configs
          echo "[1/6] Copying Defconfigs..."
          mkdir -p "$TGT/arch/arm64/configs"
          find "$SRC/arch/arm64/configs/" -iname "*biloba*" -exec cp -v {} "$TGT/arch/arm64/configs/" \; 2>/dev/null || true
          find "$SRC/arch/arm/configs/" -iname "*biloba*" -exec cp -v {} "$TGT/arch/arm/configs/" \; 2>/dev/null || true

          # 2. Device Tree (DTS / DTSI)
          echo "[2/6] Copying Device Trees..."
          mkdir -p "$TGT/arch/arm64/boot/dts/mediatek"
          find "$SRC/arch/arm64/boot/dts/" -iname "*biloba*" -exec cp -r -v {} "$TGT/arch/arm64/boot/dts/mediatek/" \; 2>/dev/null || true
          # Kaynaktaki "biloba" klasörünün içindeki tüm dosyaları (cust.dtsi vb.) oluşturduğumuz alt klasöre kopyala
          find "$SRC/arch/arm64/boot/dts/" -type d -name "biloba" -exec cp -r -v {}/* "$TGT/arch/arm64/boot/dts/mediatek/biloba/" \; 2>/dev/null || true
          # Author: Serhat KORKMAZ
          # arch/arm64/boot/dts/mediatek/ içindeki TÜM dts ve dtsi dosyalarını kopyala
          if [ -d "$SRC/arch/arm64/boot/dts/mediatek" ]; then
            echo "Serhat KORKMAZ: MediaTek dizinindeki tum dts/dtsi dosyalari kopyalaniyor..."
            find "$SRC/arch/arm64/boot/dts/mediatek/" -type f \( -name "*.dts" -o -name "*.dtsi" \) -exec cp -v {} "$TGT/arch/arm64/boot/dts/mediatek/" \; 2>/dev/null || true
          fi

          # Ust dizinde (arch/arm64/boot/dts/) kalmis olabilecek biloba dosyalarini da garantiye al
          find "$SRC/arch/arm64/boot/dts/" -maxdepth 1 -iname "*biloba*" -type f -exec cp -v {} "$TGT/arch/arm64/boot/dts/mediatek/" \; 2>/dev/null || true

          # 1. Hamle: Eger SRC icinde herhangi bir yerde cust.dtsi varsa onu bul ve hedefe kopyala
          find "$SRC" -type f -name "cust.dtsi" -exec cp -v {} "$TGT/arch/arm64/boot/dts/mediatek/biloba/" \; 2>/dev/null || true
          
          # Radikal Hamle: Hata veren include satirini kökünden sil!
          echo "Serhat KORKMAZ: Sorun yaratan #include <biloba/cust.dtsi> satiri dts dosyasindan temizleniyor..."
          find "$TGT/arch/arm64/boot/dts/mediatek/" -type f -name "*biloba*.dts" -exec sed -i '/#include <biloba\/cust\.dtsi>/d' {} \;
          
          # 3. MediaTek & Vendor Drivers
          echo "[3/6] Porting MediaTek & Touchscreen drivers..."
          if [ -d "$SRC/drivers/misc/mediatek" ]; then
            mkdir -p "$TGT/drivers/misc/mediatek"
            rsync -av --update "$SRC/drivers/misc/mediatek/" "$TGT/drivers/misc/mediatek/"
          fi

          if [ -d "$SRC/drivers/input/touchscreen" ]; then
            mkdir -p "$TGT/drivers/input/touchscreen"
            rsync -av --update "$SRC/drivers/input/touchscreen/" "$TGT/drivers/input/touchscreen/"
          fi

          # 4. Techpack & Subsystems
          echo "[4/6] Porting Techpack & Vendor Modules..."
          if [ -d "$SRC/techpack" ]; then
            rsync -av --update "$SRC/techpack/" "$TGT/techpack/"
          fi
          if [ -d "$SRC/drivers/vendor" ]; then
            rsync -av --update "$SRC/drivers/vendor/" "$TGT/drivers/vendor/"
          fi

          # 5. DT-Bindings & Headers
          echo "[5/6] Merging Header Dependencies..."
          if [ -d "$SRC/include/dt-bindings" ]; then
            rsync -av --update "$SRC/include/dt-bindings/" "$TGT/include/dt-bindings/"
          fi
          
          # 6. KBUILD LINKAGE (YENİ EKLENEN KRİTİK ADIM)
          # Bu adım, kopyalanan dosyaları ana derleme sürecine tanıtır.
          echo "[6/6] Linking ported drivers and DTS into Kbuild Makefiles..."
          
          # MediaTek sürücülerini bağla
          if [ -d "$TGT/drivers/misc/mediatek" ]; then
            grep -q "mediatek" "$TGT/drivers/misc/Makefile" || echo 'obj-y += mediatek/' >> "$TGT/drivers/misc/Makefile"
            grep -q "mediatek" "$TGT/drivers/misc/Kconfig" || sed -i '$a source "drivers/misc/mediatek/Kconfig"' "$TGT/drivers/misc/Kconfig" 2>/dev/null || true
          fi
          
          # Vendor sürücülerini bağla
          if [ -d "$TGT/drivers/vendor" ]; then
            grep -q "vendor" "$TGT/drivers/Makefile" || echo 'obj-y += vendor/' >> "$TGT/drivers/Makefile"
          fi
          
          # Techpack klasörünü bağla (Genellikle root dizininde yer alır)
          if [ -d "$TGT/techpack" ]; then
            grep -q "techpack" "$TGT/Makefile" || echo 'obj-y += techpack/' >> "$TGT/Makefile"
          fi
          
          # Biloba DTS dosyalarını MediaTek Makefile'ına otomatik ekle
          DTS_MAKEFILE="$TGT/arch/arm64/boot/dts/mediatek/Makefile"
          if [ -f "$DTS_MAKEFILE" ]; then
            find "$TGT/arch/arm64/boot/dts/" -name "*biloba*.dts" -exec basename {} \; | sed 's/\.dts/\.dtb/' | while read dtb_file; do
              grep -q "$dtb_file" "$DTS_MAKEFILE" || echo "dtb-y += $dtb_file" >> "$DTS_MAKEFILE"
            done
          fi

          echo "==> Porting & Linking completed successfully."
          
          # DİSK ALANINI RAHATLATMAK İÇİN İŞİ BİTEN KAYNAĞI SİL
          echo "==> Cleaning up biloba-source to free up disk space..."
          rm -rf "$SRC"


      - name: Fix Kconfig Help Syntax
        run: |
          cd target-kernel
          echo "==> Normalizing legacy '---help---' to 'help'..."
          find . -name "Kconfig*" -type f -exec sed -i 's/---help---/help/g' {} +

          echo "==> Writing Kconfig auto-fixer..."
          cat > "$GITHUB_WORKSPACE/fix_kconfig.py" << 'PYEOF'
          #!/usr/bin/env python3
          # Gercek hata kaynagi: "bool CONFIG_MTK_IMGSENSOR" gibi tirnaksiz
          # prompt'lar (Xiaomi GPL dump'inda yaygin), help girintisi degil.
          # Bu script iki seyi tree-wide, idempotent sekilde duzeltir:
          #  1) bool/tristate/string/int/hex/prompt sonrasi tirnaksiz BUYUK_HARF
          #     token  -> tirnak icine alinir: bool CONFIG_X -> bool "CONFIG_X"
          #  2) help blogu icinde girintisiz kalmis satirlara tab eklenir.
          import os, re, sys

          TYPE_KEYWORDS = ("bool", "tristate", "string", "int", "hex", "prompt")
          BARE_PROMPT_RE = re.compile(
              r'^(\s*)(' + '|'.join(TYPE_KEYWORDS) + r')(\s+)([A-Z][A-Z0-9_]*)\s*$'
          )
          TOP_LEVEL_KEYWORDS = {
              "config", "menuconfig", "menu", "endmenu", "choice", "endchoice",
              "if", "endif", "source", "osource", "orsource", "rsource",
              "comment", "mainmenu",
          }

          def fix_lines(lines):
              changed = False
              in_help = False
              out = []
              for line in lines:
                  stripped = line.rstrip('\r\n')

                  m = BARE_PROMPT_RE.match(stripped)
                  if m and not in_help:
                      indent, kw, sep, ident = m.groups()
                      out.append(f'{indent}{kw} "{ident}"' + line[len(stripped):])
                      changed = True
                      continue

                  bare = stripped.strip()
                  if in_help:
                      if bare == '':
                          out.append(line)
                          continue
                      if stripped[:1] not in (' ', '\t'):
                          if bare.startswith('#'):
                              in_help = False
                              out.append(line)
                              continue
                          first_word = bare.split()[0].rstrip(':') if bare.split() else ''
                          if first_word in TOP_LEVEL_KEYWORDS:
                              in_help = False
                              out.append(line)
                              continue
                          else:
                              out.append('\t' + line)
                              changed = True
                              continue
                      out.append(line)
                      continue
                  else:
                      if bare in ('help', '---help---'):
                          in_help = True
                      out.append(line)
              return out, changed

          def fix_file(path):
              with open(path, 'r', encoding='utf-8', errors='replace') as f:
                  lines = f.readlines()
              new_lines, changed = fix_lines(lines)
              if changed:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.writelines(new_lines)
              return changed

          def main():
              root = sys.argv[1] if len(sys.argv) > 1 else '.'
              fixed = []
              for dirpath, _d, filenames in os.walk(root):
                  for fn in filenames:
                      if fn == 'Kconfig' or fn.startswith('Kconfig.'):
                          p = os.path.join(dirpath, fn)
                          try:
                              if fix_file(p):
                                  fixed.append(p)
                          except Exception as e:
                              print(f"skip {p}: {e}", file=sys.stderr)
              print(f"Kconfig fixer: patched {len(fixed)} file(s)")
              for p in fixed:
                  print(" -", p)

          if __name__ == '__main__':
              main()

          PYEOF

          echo "==> Running Kconfig auto-fixer across target-kernel tree..."
          python3 "$GITHUB_WORKSPACE/fix_kconfig.py" .

          echo "==> Kconfig syntax fix completed."

      - name: Build Kernel
        run: |
          set -o pipefail
          cd target-kernel
          
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "==> Searching for biloba defconfig inside arch/arm64/configs..."
          
          # Defconfig dosyasını tara
          FOUND_DEF_PATH=$(find arch/arm64/configs/ -iname "*biloba*" -type f | head -n 1)
          
          if [ -n "$FOUND_DEF_PATH" ]; then
            DEFCONFIG_NAME=$(basename "$FOUND_DEF_PATH")
            echo "Found defconfig: $FOUND_DEF_PATH"
            
            # SADECE dosya farklı bir dizindeyse kopyala
            if [ "$FOUND_DEF_PATH" != "arch/arm64/configs/$DEFCONFIG_NAME" ]; then
              echo "Copying $DEFCONFIG_NAME to root configs directory..."
              cp -f "$FOUND_DEF_PATH" "arch/arm64/configs/"
            fi
          else
            echo "Target defconfig not found by search, fallback to input parameter..."
            DEFCONFIG_NAME="${{ github.event.inputs.defconfig_name }}"
          fi

          echo "==> Generating .config with ARCH=arm64 ($DEFCONFIG_NAME)..."
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- $DEFCONFIG_NAME 2>&1 | tee build.log

          # .config dosyası oluşmadıysa varsayılan defconfig ile fallback yap
          if [ ! -f "out/.config" ]; then
            echo "WARNING: $DEFCONFIG_NAME failed to produce out/.config! Fallback to standard defconfig..."
            make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- defconfig 2>&1 | tee -a build.log
          fi

          echo "==> Starting Kernel Compilation..."
          # BURASI GÜNCELLENDİ: Image.gz ve dtbs eklendi
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbs \
            2>&1 | tee -a build.log

      - name: Package Kernel Output (Image & DTB)
        run: |
          cd target-kernel
          mkdir -p $GITHUB_WORKSPACE/build_output

          cp build.log $GITHUB_WORKSPACE/build_output/ 2>/dev/null || true

          OUT_DIR="out/arch/arm64/boot"
          
          if [ -d "$OUT_DIR" ]; then
            echo "==> Collecting compiled images and DTBs from $OUT_DIR..."
            find $OUT_DIR -maxdepth 3 \( -name "Image*" -o -name "*.dtb" -o -name "*.dtbo" -o -name "dtb" \) -exec cp -v {} $GITHUB_WORKSPACE/build_output/ \;
          else
            echo "==> Searching whole build directory for Image/DTB files..."
            find out/ -type f \( -name "Image*" -o -name "*.dtb" -o -name "*.dtbo" \) -exec cp -v {} $GITHUB_WORKSPACE/build_output/ \; || true
          fi

          cd $GITHUB_WORKSPACE/build_output
          echo "==> Creating Output Zip Archive..."
          zip -r $GITHUB_WORKSPACE/biloba-kernel-artifacts.zip .

      - name: Upload Build Log Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: target-kernel/build.log

      - name: Upload Kernel Image & DTB Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biloba-kernel-artifacts
          path: biloba-kernel-artifacts.zip
