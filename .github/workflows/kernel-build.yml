name: Official Xiaomi Biloba Kernel Build

on:
  workflow_dispatch:

env:
  TZ: Europe/Istanbul
  XIAOMI_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  XIAOMI_BRANCH: biloba-r-oss
  KERNEL_DIR: ${{ github.workspace }}/kernel-source
  TOOLCHAIN_DIR: ${{ github.workspace }}/proton-clang
  DEFCONFIG: biloba_defconfig

jobs:
  build-official:
    name: Fetch and Build from MiCode
    runs-on: ubuntu-latest
    
    # SENIOR ARCHITECTURE: İşlemi tamamen izole bir Ubuntu 20.04 konteynerinde çalıştırıyoruz.
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v6

      - name: Sistem Bağımlılıklarını Kur (Ubuntu 20.04 LTS Ortamı)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            lzip \
            ninja-build \
            python2 \
            python3 \
            tar \
            u-boot-tools \
            xz-utils \
            zip \
            zlib1g-dev \
            libncurses5-dev \
            libncurses5 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Git Güvenlik Ayarını Yap
        run: |
          # Konteyner içi haritalamada Git mülkiyet hatalarını engellemek için
          git config --global --add safe.directory '*'

      - name: Resmi Xiaomi Kernel Kaynağını Çek (MiCode)
        run: |
          git clone --depth=1 $XIAOMI_REPO -b $XIAOMI_BRANCH $KERNEL_DIR

      - name: Proton Clang Toolchain İndir
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $TOOLCHAIN_DIR

      - name: Resmi Kerneli Derle
        run: |
          cd $KERNEL_DIR
          
          # Çapraz derleme ortam değişkenleri
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Clang LLVM eşlemeleri
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Derleme dizini ayağa kaldırma ve yapılandırma
          mkdir -p out
          make O=out $DEFCONFIG
          
          # Thread kilitlenmelerini önleyerek kararlı derleme başlat
          make -j$(nproc --all) O=out

      - name: Derleme Doğrulama Kontrolü (Sanity Check)
        run: |
          if [ ! -f $KERNEL_DIR/out/arch/arm64/boot/Image ]; then
            echo "::error::Kritik Hata: Derleme döngüsü tamamlandı fakat 'Image' çıktısı üretilemedi."
            exit 1
          fi

      - name: Resmi Image Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: official-biloba-Image
          path: kernel-source/out/arch/arm64/boot/Image

      - name: Resmi DTB Dosyalarını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: official-biloba-dtb
          path: kernel-source/out/arch/arm64/boot/dts/**/*.dtb
