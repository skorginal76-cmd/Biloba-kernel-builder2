name: Official Xiaomi Biloba Kernel Build (OEM Reference Stack)

on:
  workflow_dispatch:

env:
  TZ: Europe/Istanbul
  XIAOMI_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  XIAOMI_BRANCH: biloba-r-oss
  KERNEL_DIR: ${{ github.workspace }}/kernel-source
  CLANG_DIR: ${{ github.workspace }}/aosp-clang
  GCC64_DIR: ${{ github.workspace }}/gcc64
  GCC32_DIR: ${{ github.workspace }}/gcc32
  DEFCONFIG: biloba_defconfig

jobs:
  build-official:
    name: Build with Historical Android R Toolchains
    runs-on: ubuntu-latest
    
    # SENIOR CONFIGURATION: Google altyapısına tam uyum için Ubuntu 20.04 ortamı
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v6

      - name: Orijinal Sistem Bağımlılıklarını Kur
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            lzip \
            ninja-build \
            python2 \
            python3 \
            tar \
            u-boot-tools \
            xz-utils \
            zip \
            zlib1g-dev \
            libncurses5-dev \
            libncurses5 \
            libtinfo5 \
            wget

      - name: Git Güvenlik Ayarını Yap
        run: |
          git config --global --add safe.directory '*'

      - name: Resmi Xiaomi Kernel Kaynağını Çek (MiCode)
        run: |
          git clone --depth=1 $XIAOMI_REPO -b $XIAOMI_BRANCH $KERNEL_DIR

      - name: Tarihsel Orijinal AOSP Clang ve GCC 4.9 Toolchainlerini İndir
        run: |
          # Android 11 (R) mimarisinin resmi derleyicisi olan AOSP Clang r383902b
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r383902b.git $CLANG_DIR
          
          # Sürücü hatalarını (drivers/) önlemek için zorunlu olan orijinal AOSP GCC binary'leri
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 $GCC64_DIR
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 $GCC32_DIR

      - name: Orijinal Fabrika Standartlarında Derlemeyi Tetikle
        run: |
          cd $KERNEL_DIR
          
          # Orijinal hiyerarşiyi PATH değişkenine tam olarak işliyoruz
          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:/usr/bin:$PATH"
          
          export ARCH=arm64
          export SUBARCH=arm64
          
          # ORIJINAL GOOGLE/MEDIATEK ANDROID R DERLEME MATRIXI
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # Eski MediaTek syntax uyarılarını tamamen bypass etmesi için katı kuralları gevşetiyoruz
          export KCFLAGS="-w"
          
          # İzole çıktı alanı oluştur ve defconfig'i yapılandır
          mkdir -p out
          make O=out $DEFCONFIG
          
          # İşlemci çekirdeklerini optimize ederek kararlı üretimi başlat
          make -j$(nproc --all) O=out

      - name: Derleme Doğrulama Kontrolü (Sanity Check)
        run: |
          if [ ! -f $KERNEL_DIR/out/arch/arm64/boot/Image ]; then
            echo "::error::Kritik Hata: Orijinal AOSP araç setiyle de üretim döngüsü Image çıktısı üretemedi."
            exit 1
          fi

      - name: Orijinal Image Dosyasını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: stock-biloba-Image
          path: kernel-source/out/arch/arm64/boot/Image

      - name: Orijinal DTB Dosyalarını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: stock-biloba-dtb
          path: kernel-source/out/arch/arm64/boot/dts/**/*.dtb
