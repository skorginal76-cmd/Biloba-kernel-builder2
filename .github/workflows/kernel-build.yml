name: Godmode Biloba Kernel 4.14.336 Port & Build

on:
  workflow_dispatch:

env:
  XIAOMI_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  BILOBA_BRANCH: biloba-r-oss
  UPSTREAM_KERNEL_URL: https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.14.336.tar.xz
  KERNEL_DIR: ${{ github.workspace }}/kernel-source
  BILOBA_DIR: ${{ github.workspace }}/biloba-source
  CLANG_DIR: ${{ github.workspace }}/aosp-clang

jobs:
  build-godmode-414336:
    name: Bulletproof 4.14.336 Native Build Stack
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v6

      - name: Native 64-Bit Çapraz Derleyicileri ve Bağımlılıkları Kur
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential cpio curl flex git \
            libelf-dev libssl-dev lz4 lzip ninja-build \
            python3 python-is-python3 tar u-boot-tools xz-utils \
            zip zlib1g-dev libncurses5-dev libncurses5 libtinfo5 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            wget rsync

      - name: Git Güvenlik Ayarını Yap
        run: |
          git config --global --add safe.directory '*'

      - name: Upstream Linux 4.14.336 İndir ve Extract Et
        run: |
          echo "::group::Upstream 4.14.336 İndiriliyor"
          wget -q --show-progress $UPSTREAM_KERNEL_URL -O linux-4.14.336.tar.xz
          tar -xf linux-4.14.336.tar.xz
          mv linux-4.14.336 $KERNEL_DIR
          echo "Kernel versiyonu: $(grep -m1 'VERSION = ' $KERNEL_DIR/Makefile | cut -d'=' -f2 | tr -d ' ').$(grep -m1 'PATCHLEVEL = ' $KERNEL_DIR/Makefile | cut -d'=' -f2 | tr -d ' ').$(grep -m1 'SUBLEVEL = ' $KERNEL_DIR/Makefile | cut -d'=' -f2 | tr -d ' ')"
          echo "::endgroup::"

      - name: Resmi Xiaomi Biloba Kernel Kaynağını Çek (MT6768 Sürücü Kaynağı)
        run: |
          echo "::group::Biloba-r-oss (4.14.186) İndiriliyor"
          git clone --depth=1 $XIAOMI_REPO -b $BILOBA_BRANCH $BILOBA_DIR
          echo "Biloba kernel versiyonu:"
          head -5 $BILOBA_DIR/Makefile
          echo "::endgroup::"

      - name: MT6768 (Biloba) Platform Sürücülerini 4.14.336'ya Portla
        run: |
          cd $KERNEL_DIR
          echo "::group::MT6768 Platform Sürücü Portlama"

          # 1. MTK Platform sürücü dizinlerini kopyala
          echo "→ drivers/misc/mediatek portlanıyor..."
          mkdir -p drivers/misc/mediatek
          cp -r $BILOBA_DIR/drivers/misc/mediatek/* drivers/misc/mediatek/ 2>/dev/null || true
          if ! grep -q "mediatek" drivers/misc/Makefile; then
            echo "obj-y += mediatek/" >> drivers/misc/Makefile
          fi

          # 2. Device Tree dosyalarını kopyala
          echo "→ Device Tree portlanıyor..."
          mkdir -p arch/arm64/boot/dts/mediatek
          cp -r $BILOBA_DIR/arch/arm64/boot/dts/mediatek/* arch/arm64/boot/dts/mediatek/ 2>/dev/null || true
          # DTS Makefile düzenlemesi
          if [ -f arch/arm64/boot/dts/Makefile ]; then
            if ! grep -q "mediatek" arch/arm64/boot/dts/Makefile; then
              echo "subdir-y += mediatek" >> arch/arm64/boot/dts/Makefile
            fi
          fi

          # 3. Config dosyasını kopyala
          echo "→ biloba_defconfig portlanıyor..."
          cp $BILOBA_DIR/arch/arm64/configs/biloba_defconfig arch/arm64/configs/ 2>/dev/null || true

          # 4. Dokunmatik ekran sürücülerini kopyala
          echo "→ Dokunmatik sürücüler portlanıyor..."
          mkdir -p drivers/input/touchscreen/mediatek
          cp -r $BILOBA_DIR/drivers/input/touchscreen/mediatek/* drivers/input/touchscreen/mediatek/ 2>/dev/null || true
          if ! grep -q "mediatek" drivers/input/touchscreen/Makefile; then
            echo "obj-y += mediatek/" >> drivers/input/touchscreen/Makefile
          fi

          # 5. Power/PMIC sürücülerini kopyala
          echo "→ Power sürücüleri portlanıyor..."
          mkdir -p drivers/power
          cp -r $BILOBA_DIR/drivers/power/* drivers/power/ 2>/dev/null || true

          # 6. Clock sürücülerini kopyala
          echo "→ Clock sürücüleri portlanıyor..."
          mkdir -p drivers/clk/mediatek
          cp -r $BILOBA_DIR/drivers/clk/mediatek/* drivers/clk/mediatek/ 2>/dev/null || true

          # 7. IRQ chip sürücülerini kopyala
          echo "→ IRQ sürücüleri portlanıyor..."
          cp $BILOBA_DIR/drivers/irqchip/*mediatek* drivers/irqchip/ 2>/dev/null || true
          cp $BILOBA_DIR/drivers/irqchip/*mt67* drivers/irqchip/ 2>/dev/null || true

          # 8. SoC sürücülerini kopyala
          echo "→ SoC sürücüleri portlanıyor..."
          mkdir -p drivers/soc/mediatek
          cp -r $BILOBA_DIR/drivers/soc/mediatek/* drivers/soc/mediatek/ 2>/dev/null || true
          if ! grep -q "mediatek" drivers/soc/Makefile; then
            echo "obj-y += mediatek/" >> drivers/soc/Makefile
          fi

          # 9. Pin kontrol sürücülerini kopyala
          echo "→ Pin kontrol sürücüleri portlanıyor..."
          mkdir -p drivers/pinctrl/mediatek
          cp -r $BILOBA_DIR/drivers/pinctrl/mediatek/* drivers/pinctrl/mediatek/ 2>/dev/null || true

          # 10. SPI sürücülerini kopyala
          echo "→ SPI sürücüleri portlanıyor..."
          cp $BILOBA_DIR/drivers/spi/*mediatek* drivers/spi/ 2>/dev/null || true
          cp $BILOBA_DIR/drivers/spi/*mt67* drivers/spi/ 2>/dev/null || true

          # 11. I2C sürücülerini kopyala
          echo "→ I2C sürücüleri portlanıyor..."
          cp $BILOBA_DIR/drivers/i2c/*mediatek* drivers/i2c/ 2>/dev/null || true
          cp $BILOBA_DIR/drivers/i2c/*mt67* drivers/i2c/ 2>/dev/null || true

          # 12. USB sürücülerini kopyala
          echo "→ USB sürücüleri portlanıyor..."
          cp -r $BILOBA_DIR/drivers/usb/* drivers/usb/ 2>/dev/null || true

          # 13. MMC sürücülerini kopyala
          echo "→ MMC sürücüleri portlanıyor..."
          cp $BILOBA_DIR/drivers/mmc/*mediatek* drivers/mmc/ 2>/dev/null || true
          cp $BILOBA_DIR/drivers/mmc/*mt67* drivers/mmc/ 2>/dev/null || true

          # 14. Thermal sürücülerini kopyala
          echo "→ Thermal sürücüleri portlanıyor..."
          cp $BILOBA_DIR/drivers/thermal/*mediatek* drivers/thermal/ 2>/dev/null || true
          cp $BILOBA_DIR/drivers/thermal/*mt67* drivers/thermal/ 2>/dev/null || true

          # 15. CPUFreq sürücülerini kopyala
          echo "→ CPUFreq sürücüleri portlanıyor..."
          cp $BILOBA_DIR/drivers/cpufreq/*mediatek* drivers/cpufreq/ 2>/dev/null || true
          cp $BILOBA_DIR/drivers/cpufreq/*mt67* drivers/cpufreq/ 2>/dev/null || true

          # 16. CPUIdle sürücülerini kopyala
          echo "→ CPUIdle sürücüleri portlanıyor..."
          cp $BILOBA_DIR/drivers/cpuidle/*mediatek* drivers/cpuidle/ 2>/dev/null || true
          cp $BILOBA_DIR/drivers/cpuidle/*mt67* drivers/cpuidle/ 2>/dev/null || true

          # 17. Watchdog sürücülerini kopyala
          echo "→ Watchdog sürücüleri portlanıyor..."
          cp $BILOBA_DIR/drivers/watchdog/*mediatek* drivers/watchdog/ 2>/dev/null || true
          cp $BILOBA_DIR/drivers/watchdog/*mt67* drivers/watchdog/ 2>/dev/null || true

          # 18. LED sürücülerini kopyala
          echo "→ LED sürücüleri portlanıyor..."
          cp $BILOBA_DIR/drivers/leds/*mediatek* drivers/leds/ 2>/dev/null || true
          cp $BILOBA_DIR/drivers/leds/*mt67* drivers/leds/ 2>/dev/null || true

          # 19. Network sürücülerini kopyala
          echo "→ Network sürücüleri portlanıyor..."
          cp $BILOBA_DIR/drivers/net/*mediatek* drivers/net/ 2>/dev/null || true
          cp $BILOBA_DIR/drivers/net/*mt67* drivers/net/ 2>/dev/null || true

          # 20. GPU/DRM sürücülerini kopyala
          echo "→ GPU/DRM sürücüleri portlanıyor..."
          mkdir -p drivers/gpu/drm/mediatek
          cp -r $BILOBA_DIR/drivers/gpu/drm/mediatek/* drivers/gpu/drm/mediatek/ 2>/dev/null || true

          # 21. Sound sürücülerini kopyala (sadece MTK özel)
          echo "→ Sound sürücüleri portlanıyor..."
          for f in $BILOBA_DIR/sound/soc/mediatek/*; do
            if [ -e "$f" ]; then
              mkdir -p sound/soc/mediatek
              cp -r "$f" sound/soc/mediatek/ 2>/dev/null || true
            fi
          done

          # 22. SADECE MTK ÖZEL Header'ları kopyala
          # NOT: include/trace/events/ ve include/linux/tracepoint.h gibi temel
          # tracepoint header'ları upstream 4.14.336 ile uyumlu olmalıdır.
          # Biloba'dan kopyalanırsa PG_workingset, PG_iommu, pm_qos tracepoint
          # argüman sayısı gibi derleme hataları oluşur.
          echo "→ MTK özel header'ları portlanıyor..."

          # dt-bindings (device tree binding'leri - güvenli)
          if [ -d "$BILOBA_DIR/include/dt-bindings" ]; then
            cp -r $BILOBA_DIR/include/dt-bindings/* include/dt-bindings/ 2>/dev/null || true
          fi

          # include/linux/soc/mediatek/ (mtk-cmdq.h gibi önemli header'lar)
          if [ -d "$BILOBA_DIR/include/linux/soc/mediatek" ]; then
            mkdir -p include/linux/soc/mediatek
            cp -r $BILOBA_DIR/include/linux/soc/mediatek/* include/linux/soc/mediatek/ 2>/dev/null || true
          fi

          # include/linux/soc/ altındaki diğer MTK dizinleri
          for soc_dir in $BILOBA_DIR/include/linux/soc/*; do
            if [ -d "$soc_dir" ]; then
              dir_name=$(basename "$soc_dir")
              if echo "$dir_name" | grep -qiE "mediatek|mt67"; then
                mkdir -p "include/linux/soc/$dir_name"
                cp -r "$soc_dir"/* "include/linux/soc/$dir_name/" 2>/dev/null || true
              fi
            fi
          done

          # SADECE mediatek/mt67 ile ilgili linux header'ları
          for hdr in $BILOBA_DIR/include/linux/*mediatek* $BILOBA_DIR/include/linux/*mt67*; do
            if [ -e "$hdr" ]; then
              cp "$hdr" include/linux/ 2>/dev/null || true
            fi
          done
          for hdr in $BILOBA_DIR/include/uapi/linux/*mediatek* $BILOBA_DIR/include/uapi/linux/*mt67*; do
            if [ -e "$hdr" ]; then
              cp "$hdr" include/uapi/linux/ 2>/dev/null || true
            fi
          done

          # trace/events altında SADECE mediatek ile ilgili trace header'ları varsa
          for trc in $BILOBA_DIR/include/trace/events/*mediatek* $BILOBA_DIR/include/trace/events/*mt67*; do
            if [ -e "$trc" ]; then
              cp "$trc" include/trace/events/ 2>/dev/null || true
            fi
          done

          # 23. Arch dosyalarını kopyala (sadece biloba özel)
          echo "→ Arch dosyaları portlanıyor..."
          if [ -d "$BILOBA_DIR/arch/arm64/kernel" ]; then
            cp $BILOBA_DIR/arch/arm64/kernel/*mediatek* arch/arm64/kernel/ 2>/dev/null || true
            cp $BILOBA_DIR/arch/arm64/kernel/*mt67* arch/arm64/kernel/ 2>/dev/null || true
          fi
          if [ -d "$BILOBA_DIR/arch/arm64/mm" ]; then
            cp $BILOBA_DIR/arch/arm64/mm/*mediatek* arch/arm64/mm/ 2>/dev/null || true
            cp $BILOBA_DIR/arch/arm64/mm/*mt67* arch/arm64/mm/ 2>/dev/null || true
          fi

          echo "::endgroup::"
          echo "SUCCESS: MT6768 (Biloba) sürücüleri 4.14.336'ya portlandı."
          echo "NOT: Derleme hataları çıkarsa, API farklılıklarından kaynaklanıyor olabilir."

      - name: OEM Eksik Firmware Yaması (Kapsamlı Dummy Injection)
        run: |
          cd $KERNEL_DIR
          echo "::group::Dokunmatik Panel (Focaltech) Firmware Yamaları"

          mkdir -p drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware

          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_huaxing_v0c.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_tianma_v0c.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_huaxing_v0d.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_tianma_v0d.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_sample.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_sample1.i
          echo "0x00" > drivers/input/touchscreen/mediatek/ft8719_spi/include/firmware/fw_sample2.i

          echo "::endgroup::"

      - name: ZRAM Gelişmiş Kapasite ve Kullanım Yaması (8GB Disk / 6GB Limit)
        run: |
          cd $KERNEL_DIR
          echo "::group::ZRAM Çekirdek Seviyesi Sürücü Enjeksiyonu"

          python3 -c '
          import os
          filepath = "drivers/block/zram/zram_drv.c"
          if os.path.exists(filepath):
              with open(filepath, "r") as f:
                  code = f.read()

              if "static ssize_t disksize_store" in code:
                  pos = code.find("static ssize_t disksize_store")
                  brace = code.find("{", pos)
                  if brace != -1:
                      code = code[:brace+1] + "\n\tbuf = \"8G\";\n" + code[brace+1:]

              if "static ssize_t mem_limit_store" in code:
                  pos = code.find("static ssize_t mem_limit_store")
                  brace = code.find("{", pos)
                  if brace != -1:
                      code = code[:brace+1] + "\n\tbuf = \"6G\";\n" + code[brace+1:]

              if "zram->disksize = disksize;" in code:
                  code = code.replace("zram->disksize = disksize;", "zram->disksize = disksize;\n\tzram->limit_pages = 6ULL * 1024 * 1024 * 1024 >> PAGE_SHIFT;")

              with open(filepath, "w") as f:
                  f.write(code)
              print("SUCCESS: ZRAM kilitlendi.")
          '
          echo "::endgroup::"

      - name: Kingston Fury 32GB Sanal Bellek Cihaz Sınıfı Enjeksiyonu (Advanced Binary Mode)
        run: |
          cd $KERNEL_DIR
          echo "::group::Native Virtual Memory Device Donanım Yapısı Enjekte Ediliyor"

          # Resmi Aygıt Sınıfı ve İkili (Binary) Veri Bloklu Sürücü Tasarımı
          cat << 'EOF' > drivers/base/kingston_fury.c
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/init.h>
          #include <linux/device.h>
          #include <linux/sysfs.h>
          #include <linux/string.h>

          static struct class *kf_class;
          static struct device *kf_device;

          // Kingston Fury Donanım Kimliği ve XMP Karakteristiklerini Simüle Eden 64-Baytlık Saf İkili (Binary) Kod Bloğu
          static const unsigned char kf_hardware_binary[] = {
              0x23, 0x4B, 0x49, 0x4E, 0x47, 0x53, 0x54, 0x4F, // "KINGSTON" ASCII başlığı
              0x4E, 0x20, 0x46, 0x55, 0x52, 0x59, 0x20, 0x33, // "N FURY 3"
              0x32, 0x47, 0x42, 0x00, 0x01, 0x02, 0x03, 0x04, // "2GB" Kapasite İmzası
              0x0B, 0x40, 0x0E, 0x0C, 0x12, 0x01, 0x00, 0x00, // Çekirdek JEDEC Donanım Zamanlamaları
              0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 
              0x85, 0x9B, 0xFF, 0x00, 0x02, 0x00, 0x00, 0x00, // XMP Donanım Voltaj Profili (1.35V Simülasyonu)
              0x46, 0x55, 0x52, 0x59, 0x58, 0x4D, 0x50, 0x31, // "FURYXMP1" Binary Profil Mührü
              0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x03  // Revizyon Kapanış Kodu
          };

          // Metinsel Özellik Gösterimleri
          static ssize_t vendor_show(struct device *dev, struct device_attribute *attr, char *buf) {
              return sprintf(buf, "Kingston\n");
          }
          static ssize_t model_show(struct device *dev, struct device_attribute *attr, char *buf) {
              return sprintf(buf, "Fury Renegade Virtual High-Speed\n");
          }
          static ssize_t capacity_bytes_show(struct device *dev, struct device_attribute *attr, char *buf) {
              return sprintf(buf, "34359738368\n"); // Tam 32 GB
          }
          static ssize_t clock_speed_mhz_show(struct device *dev, struct device_attribute *attr, char *buf) {
              return sprintf(buf, "4600 MHz\n"); // Sanal Frekans Sınırı
          }
          static ssize_t type_show(struct device *dev, struct device_attribute *attr, char *buf) {
              return sprintf(buf, "Virtual Memory Device (Zero-Footprint Topology Mode)\n");
          }

          static DEVICE_ATTR_RO(vendor);
          static DEVICE_ATTR_RO(model);
          static DEVICE_ATTR_RO(capacity_bytes);
          static DEVICE_ATTR_RO(clock_speed_mhz);
          static DEVICE_ATTR_RO(type);

          // Sistem araçlarının ham donanım imzası okuması için oluşturulan Binary Aygıt Düğümü
          static ssize_t kf_binary_read(struct file *filp, struct kobject *kobj,
                                        struct bin_attribute *bin_attribute,
                                        char *buf, loff_t off, size_t count) {
              return memory_read_from_buffer(buf, count, &off, kf_hardware_binary, sizeof(kf_hardware_binary));
          }

          static struct bin_attribute kf_bin_attr = {
              .attr = { .name = "raw_hardware_specs", .mode = 0444 },
              .size = sizeof(kf_hardware_binary),
              .read = kf_binary_read,
          };

          static int __init kingston_fury_device_init(void) {
              int ret;

              // 1. Çekirdeğe "virtual_memory" adında resmi bir aygıt sınıfı kaydediyoruz
              kf_class = class_create(THIS_MODULE, "virtual_memory");
              if (IS_ERR(kf_class)) return PTR_ERR(kf_class);

              // 2. Bu sınıfın altına "kingston_fury0" isimli resmi sanal bellek cihazını bağlıyoruz
              kf_device = device_create(kf_class, NULL, MKDEV(0, 0), NULL, "kingston_fury0");
              if (IS_ERR(kf_device)) {
                  class_destroy(kf_class);
                  return PTR_ERR(kf_device);
              }

              // 3. Standart sysfs donanım niteliklerini aygıta mühürlüyoruz
              ret = device_create_file(kf_device, &dev_attr_vendor);
              ret = device_create_file(kf_device, &dev_attr_model);
              ret = device_create_file(kf_device, &dev_attr_capacity_bytes);
              ret = device_create_file(kf_device, &dev_attr_clock_speed_mhz);
              ret = device_create_file(kf_device, &dev_attr_type);

              // 4. İkili (Binary) donanım imzasını aygıta enjekte ediyoruz
              ret = device_create_bin_file(kf_device, &kf_bin_attr);

              return 0;
          }

          device_initcall(kingston_fury_device_init);
          MODULE_LICENSE("GPL");
          EOF

          # Sürücüyü derleme ağacına dahil et
          echo "obj-y += kingston_fury.o" >> drivers/base/Makefile
          echo "SUCCESS: Kingston Fury resmi Virtual Memory Device yapısı binary desteğiyle entegre edildi."
          echo "::endgroup::"

      - name: Resmi Google AOSP Clang İndir (Sadece Frontend)
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android11-release $CLANG_DIR

      - name: Godmode 4.14.336 Derleme Başlat (Doğrudan Argümanlı)
        run: |
          cd $KERNEL_DIR

          export PATH="$CLANG_DIR/clang-r383902b/bin:$PATH"

          mkdir -p out

          # Config'i uygula ve eski config ile senkronize et
          make O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" biloba_defconfig

          # Yeni config seçeneklerini varsayılan değerlerle doldur (non-interactive)
          yes "" | make O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" oldconfig

          # Gereksiz upstream sürücüleri kapat (telefon kerneli için)
          ./scripts/config --file out/.config --disable CONFIG_MEDIA_RC_SUPPORT
          ./scripts/config --file out/.config --disable CONFIG_RC_CORE
          ./scripts/config --file out/.config --disable CONFIG_RC_DECODERS
          ./scripts/config --file out/.config --disable CONFIG_RC_DEVICES
          ./scripts/config --file out/.config --disable CONFIG_VIDEO_V4L2
          ./scripts/config --file out/.config --disable CONFIG_VIDEO_DEV
          ./scripts/config --file out/.config --disable CONFIG_DVB_CORE
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_AUDIO
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_US122L
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_USX2Y
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_CAIAQ
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_6FIRE
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_HIFACE
          ./scripts/config --file out/.config --disable CONFIG_SND_BCD2000
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_LINE6
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_POD
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_PODHD
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_TONEPORT
          ./scripts/config --file out/.config --disable CONFIG_SND_USB_VARIAX
          make O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" oldconfig

          # Derlemeyi başlat ve log dosyasına kaydet
          make -j$(nproc --all) O=out ARCH=arm64 SUBARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error" 2>&1 | tee build.log

          # Hata varsa son 50 satırı göster
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::Derleme hatası tespit edildi!"
            echo "::group::Son 50 hata satırı"
            grep -n -i "error:" build.log | tail -50 || true
            echo "::endgroup::"
            echo "::group::Son 100 derleme satırı"
            tail -100 build.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Derleme Doğrulama Kontrolü (Sanity Check)
        run: |
          if [ ! -f $KERNEL_DIR/out/arch/arm64/boot/Image ]; then
            echo "::error::Kritik Hata: Godmode 4.14.336 üretimi Image çıktısı üretemedi."
            exit 1
          fi

      - name: Derleme Logunu Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel-source/build.log

      - name: Orijinal Image Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: godmode-biloba-4.14.336-Image
          path: kernel-source/out/arch/arm64/boot/Image

      - name: Orijinal DTB Dosyalarını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: godmode-biloba-4.14.336-dtb
          path: kernel-source/out/arch/arm64/boot/dts/**/*.dtb
